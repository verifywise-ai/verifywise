# Keep the scheme a TLS-terminating host proxy reports; this container itself
# only ever sees plain HTTP from it.
map $http_x_forwarded_proto $vw_forwarded_proto {
    ""      $scheme;
    default $http_x_forwarded_proto;
}

server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Content-Security-Policy in report-only mode: browsers report
    # violations without blocking anything.
    #
    # Promotion path to an enforced policy:
    #   1. Triage the violation reports collected in this Report-Only mode.
    #   2. Remove 'unsafe-inline' from script-src/style-src (move inline
    #      scripts/styles to external files or use nonces/hashes).
    #   3. Promote to an enforced policy by renaming the header to
    #      Content-Security-Policy (drop the "-Report-Only" suffix).
    #
    # NOTE: HSTS (Strict-Transport-Security) is intentionally NOT set here.
    # This container serves plain HTTP only; HSTS is set at the
    # TLS-terminating layer (host nginx / kubernetes ingress) where it is
    # actually honored by browsers.
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https:; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;

    # Vite dev server proxy
    location / {
        try_files $uri $uri/ /index.html;
        # proxy_pass http://localhost:5173;
        # proxy_http_version 1.1;
        # proxy_set_header Upgrade $http_upgrade;
        # proxy_set_header Connection 'upgrade';
        # proxy_set_header Host $host;
        # proxy_cache_bypass $http_upgrade;
    }

    # Backend for /api and /v1. This file is an nginx template: the image's
    # entrypoint fills in VW_BACKEND_URL (default http://backend:3000, see
    # Clients/Dockerfile; checked by 18-verifywise.envsh) and the
    # container's DNS server. The address is
    # resolved per request, so nginx still starts when the backend is down or
    # its name does not resolve, and a backend that moves to a new IP is found.
    # Inside this container "localhost" is the frontend itself, never the backend.
    resolver ${NGINX_LOCAL_RESOLVERS} valid=10s ipv6=off;
    set $vw_backend ${VW_BACKEND_URL};

    # Client address: the backend trusts one proxy hop (trust proxy = 1) and
    # rate-limits by client IP. Behind a host proxy this container is a second
    # hop, so the entrypoint script 18-verifywise.envsh writes
    # conf.d/00-vw-realip.conf, which takes the client from X-Forwarded-For
    # when the request comes from an address in VW_TRUSTED_PROXIES.

    # Proxy API requests to backend.
    # ^~ so the static-file regex below never claims an /api path ending in .png etc.
    # The proxy target is the operator's VW_BACKEND_URL, never taken from the
    # request, so Semgrep's SSRF rule (which wants "internal") does not apply:
    # "internal" would make these public routes unreachable.
    location ^~ /api/ {
        # no URI part - keeps the /api prefix
        proxy_pass $vw_backend; # nosemgrep: generic.nginx.security.missing-internal.missing-internal
        proxy_http_version 1.1;
        # A stopped backend's address can stay cached for up to 10s and then
        # drops connections silently; fail fast instead of nginx's default 60s
        proxy_connect_timeout 5s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $vw_forwarded_proto;
        # Same as the host nginx template; the backend enforces its own
        # per-route upload limits (up to 30 MB today)
        client_max_body_size 200m;
        # Same as the app's request timeout (customAxios, 120s)
        proxy_read_timeout 120s;
        # API clients parse JSON errors (the backend's {"message": ...}
        # shape), not nginx's HTML pages
        error_page 502 503 = @api_unavailable;
        error_page 504 = @api_timeout;
    }

    location @api_unavailable {
        default_type application/json;
        return 503 '{"message":"VerifyWise is unavailable, please retry shortly"}';
    }

    location @api_timeout {
        default_type application/json;
        # Never connected: down, not slow (see @v1_timeout)
        if ($upstream_connect_time ~ "^-(, -)*$") {
            return 503 '{"message":"VerifyWise is unavailable, please retry shortly"}';
        }
        return 504 '{"message":"VerifyWise did not respond in time"}';
    }

    # OpenAI-compatible AI Gateway API used with virtual keys (base URL /v1).
    # ^~ so the static-file regex below never claims a /v1 path ending in .js etc.
    location ^~ /v1/ {
        # no URI part - keeps the /v1 prefix
        proxy_pass $vw_backend; # nosemgrep: generic.nginx.security.missing-internal.missing-internal
        proxy_http_version 1.1;
        proxy_connect_timeout 5s; # see /api
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $vw_forwarded_proto;
        # Stream responses as they arrive and allow slow model calls
        proxy_buffering off;
        proxy_read_timeout 300s;
        client_max_body_size 10m;
        # SDK clients expect JSON, not nginx's HTML error pages
        error_page 413 = @v1_too_large;
        error_page 502 503 = @v1_unavailable;
        error_page 504 = @v1_timeout;
    }

    location @v1_too_large {
        default_type application/json;
        return 413 '{"detail":"Request body is larger than 10 MB"}';
    }

    location @v1_unavailable {
        default_type application/json;
        return 503 '{"detail":"VerifyWise is unavailable, please retry shortly"}';
    }

    location @v1_timeout {
        default_type application/json;
        # No connect time means the backend never accepted the connection:
        # it is down, not slow. One "-" per address tried ("-, -" when the
        # name has several).
        if ($upstream_connect_time ~ "^-(, -)*$") {
            return 503 '{"detail":"VerifyWise is unavailable, please retry shortly"}';
        }
        return 504 '{"detail":"The AI Gateway request timed out"}';
    }

    error_page 404 /index.html;
    # error_page 502 503 504 /upgrade.html;

    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg|map)$ {
        expires max;
        log_not_found off;
    }
}
