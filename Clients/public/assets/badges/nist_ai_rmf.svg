<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Background circle - NIST navy -->
  <circle cx="32" cy="32" r="30" fill="#0B3D91"/>

  <!-- Outer risk ring (four-quadrant: Govern / Map / Measure / Manage) -->
  <g fill="none" stroke="#FFFFFF" stroke-width="2">
    <circle cx="32" cy="32" r="18"/>
    <line x1="32" y1="14" x2="32" y2="50"/>
    <line x1="14" y1="32" x2="50" y2="32"/>
  </g>

  <!-- Quadrant dots -->
  <g fill="#FCD34D">
    <circle cx="24" cy="24" r="1.8"/>
    <circle cx="40" cy="24" r="1.8"/>
    <circle cx="24" cy="40" r="1.8"/>
    <circle cx="40" cy="40" r="1.8"/>
  </g>

  <!-- AI node in center -->
  <circle cx="32" cy="32" r="5" fill="#FFFFFF"/>
  <text x="32" y="34.5" font-family="Arial, sans-serif" font-size="6" font-weight="bold" fill="#0B3D91" text-anchor="middle">AI</text>

  <!-- Label -->
  <text x="32" y="58" font-family="Arial, sans-serif" font-size="5" font-weight="bold" fill="#FFFFFF" text-anchor="middle">NIST AI RMF</text>
</svg>
