<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Background circle - EU blue -->
  <circle cx="32" cy="32" r="30" fill="#003399"/>

  <!-- Clipboard (quality management system) -->
  <rect x="19" y="12" width="26" height="34" rx="2" fill="#FFFFFF"/>
  <rect x="26" y="9" width="12" height="6" rx="1.5" fill="#FFCC00"/>

  <!-- Checklist lines -->
  <g fill="#003399">
    <rect x="23" y="20" width="3" height="3" rx="0.5"/>
    <rect x="28" y="20.75" width="13" height="1.5"/>
    <rect x="23" y="27" width="3" height="3" rx="0.5"/>
    <rect x="28" y="27.75" width="13" height="1.5"/>
    <rect x="23" y="34" width="3" height="3" rx="0.5"/>
    <rect x="28" y="34.75" width="8" height="1.5"/>
  </g>

  <!-- Checkmark badge -->
  <circle cx="43" cy="43" r="8" fill="#FFCC00"/>
  <path d="M39.5 43 L42 45.5 L47 40.5" stroke="#003399" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- EN 18286 text -->
  <text x="32" y="58" font-family="Arial, sans-serif" font-size="6" font-weight="bold" fill="#FFFFFF" text-anchor="middle">EN 18286</text>
</svg>
