apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Production overlay: base resources + TLS ingress.
# secrets.env is generated by CI/CD (never commit real values).

resources:
  - ../base
  - ingress-tls.yaml

generatorOptions:
  disableNameSuffixHash: true
  labels:
    type: generated

secretGenerator:
  - name: verifywise-secret
    envs:
      - secrets.env
