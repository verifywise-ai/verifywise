# NOTE: sensitive values must be supplied via a Secret (see kubernetes/.k8s/secrets-example.yaml).
apiVersion: v1
kind: ConfigMap
metadata:
  name: verifywise-config
data:
  BACKEND_PORT: "3000"
  BACKEND_URL: "http://verifywise.ai:3000"
  FRONTEND_PORT: "8080"
  FRONTEND_URL: "http://verifywise.ai:8080"
  HOST: "verifywise.ai"
  LLM_EVALS_PORT: "8000"
  NODE_ENV: "production"
  DB_SSL: "false"
  MULTI_TENANCY_ENABLED: "false"
  DB_HOST: "localhost"
  DB_PORT: "5432"
  MOCK_DATA_ON: "false"
