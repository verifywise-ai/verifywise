apiVersion: apps/v1
kind: Deployment
metadata:
  name: verifywise
spec:
  replicas: 1
  template:
    spec:
      automountServiceAccountToken: false
      # Pod-level security context (KSV-0118): runtime-default seccomp profile.
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: postgres-volume
          persistentVolumeClaim:
            claimName: verifywise-postgres-volume
      containers:
        - name: verifywise-frontend
          resources:
            requests:
              cpu: "100m"
              memory: "512Mi"
            limits:
              cpu: "200m"
              memory: "768Mi"
        - name: verifywise-backend
          resources:
            requests:
              cpu: "100m"
              memory: "512Mi"
            limits:
              cpu: "200m"
              memory: "768Mi"
        - name: verifywise-worker
          resources:
            requests:
              cpu: "100m"
              memory: "512Mi"
            limits:
              cpu: "200m"
              memory: "768Mi"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
        - name: verifywise-eval-server
          resources:
            requests:
              cpu: "100m"
              memory: "512Mi"
            limits:
              cpu: "200m"
              memory: "768Mi"
        - name: verifywise-redis
          resources:
            requests:
              cpu: "100m"
              memory: "512Mi"
            limits:
              cpu: "200m"
              memory: "768Mi"
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 999
            capabilities:
              drop:
                - ALL
        - name: verifywise-postgres-temp
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
          resources:
            requests:
              cpu: "100m"
              memory: "512Mi"
            limits:
              cpu: "200m"
              memory: "768Mi"
          volumeMounts:
            - name: postgres-volume
              mountPath: /var/lib/postgresql/data