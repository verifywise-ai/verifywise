# IMPORTANT: This is an example file. Copy this to secrets.yaml and replace
# the placeholder values.
# DO NOT commit secrets.yaml to version control!
#
#   cp secrets-example.yaml secrets.yaml
#   # edit secrets.yaml
#   kubectl apply -f secrets.yaml
#
# `stringData` accepts plaintext values — Kubernetes handles base64 encoding
# for you. This is the reason the placeholders below look like readable text
# instead of base64. Generate strong secrets with e.g. `openssl rand -hex 32`.
apiVersion: v1
kind: Secret
metadata:
  name: verifywise-secrets
  namespace: verifywise
  labels:
    app: verifywise
type: Opaque
stringData:
  # Super-Admin (seeded on first boot)
  SUPERADMIN_EMAIL: admin@verifywise.com
  SUPERADMIN_PASSWORD: REPLACE_WITH_STRONG_PASSWORD

  # Database
  DB_USER: postgres
  DB_PASSWORD: REPLACE_WITH_STRONG_PASSWORD
  DB_NAME: verifywise

  # JWT — generate with `openssl rand -hex 64`
  JWT_SECRET: REPLACE_WITH_OPENSSL_RAND_HEX_64
  REFRESH_TOKEN_SECRET: REPLACE_WITH_OPENSSL_RAND_HEX_64

  # Encryption
  ENCRYPTION_ALGORITHM: aes-256-cbc
  ENCRYPTION_PASSWORD: REPLACE_WITH_OPENSSL_RAND_HEX_32
  ENCRYPTION_KEY: REPLACE_WITH_OPENSSL_RAND_HEX_32

  # Service-to-service — generate with `openssl rand -hex 32`
  AI_GATEWAY_INTERNAL_KEY: REPLACE_WITH_OPENSSL_RAND_HEX_32
  EVAL_SERVER_INTERNAL_KEY: REPLACE_WITH_OPENSSL_RAND_HEX_32

  # Slack (optional)
  SLACK_CLIENT_SECRET: REPLACE_OR_LEAVE_EMPTY
  SLACK_BOT_TOKEN: REPLACE_OR_LEAVE_EMPTY
  SLACK_USER_OAUTH_TOKEN: REPLACE_OR_LEAVE_EMPTY

  # Email — set only for the provider you use
  RESEND_API_KEY: REPLACE_OR_LEAVE_EMPTY
  SMTP_PASS: REPLACE_OR_LEAVE_EMPTY
  EXCHANGE_ONLINE_PASS: REPLACE_OR_LEAVE_EMPTY
  EXCHANGE_ONPREM_PASS: REPLACE_OR_LEAVE_EMPTY

  # AWS SES
  AWS_SES_ACCESS_KEY_ID: REPLACE_OR_LEAVE_EMPTY
  AWS_SES_SECRET_ACCESS_KEY: REPLACE_OR_LEAVE_EMPTY
