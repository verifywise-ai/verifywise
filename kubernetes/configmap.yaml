apiVersion: v1
kind: ConfigMap
metadata:
  name: verifywise-config
  namespace: verifywise
  labels:
    app: verifywise
data:
  # Application Settings
  NODE_ENV: "production"
  BACKEND_PORT: "3000"
  FRONTEND_PORT: "80"

  # In-cluster service URLs (Service names, not pod IPs)
  BACKEND_URL: "http://backend:3000"
  LLM_EVALS_URL: "http://eval-server:8000"
  AI_GATEWAY_URL: "http://ai-gateway:8100"
  AI_GATEWAY_PORT: "8100"
  EXPRESS_BACKEND_URL: "http://backend:3000"

  # Public URL where the browser reaches the frontend (used in invite emails,
  # notifications, etc.). Must be reachable from the user's browser — NOT a
  # cluster-internal name like "http://frontend".
  #   • minikube local: http://localhost   (with `minikube tunnel` running)
  #   • cloud HTTP:     http://<ingress-external-ip>
  #   • cloud HTTPS:    https://your-domain.com
  FRONTEND_URL: "http://localhost"

  # Database Settings
  DB_HOST: "postgresdb"
  DB_PORT: "5432"
  DB_SSL: "false"

  # Redis Settings
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  REDIS_URL: "redis://redis:6379/0"

  # Feature Flags
  MOCK_DATA_ON: "false"
  MULTI_TENANCY_ENABLED: "false"

  # Email Configuration
  EMAIL_PROVIDER: "resend"  # Options: resend, smtp, exchange-online, exchange-onprem, amazon-ses
  EMAIL_ID: "no-reply@app.verifywise.ai"

  # SMTP Settings (when EMAIL_PROVIDER=smtp)
  SMTP_HOST: "smtp.gmail.com"
  SMTP_PORT: "587"
  SMTP_SECURE: "false"

  # Exchange Online Settings (when EMAIL_PROVIDER=exchange-online)
  EXCHANGE_ONLINE_TENANT_ID: ""  # Optional

  # Exchange On-Premises Settings (when EMAIL_PROVIDER=exchange-onprem)
  EXCHANGE_ONPREM_HOST: "mail.company.com"
  EXCHANGE_ONPREM_PORT: "587"
  EXCHANGE_ONPREM_DOMAIN: "COMPANY"
  EXCHANGE_ONPREM_SECURE: "false"

  # AWS SES Settings (when EMAIL_PROVIDER=amazon-ses)
  AWS_SES_REGION: "us-east-1"
  AWS_SES_API_VERSION: "2010-12-01"
  SES_CONFIGURATION_SET: ""  # Optional

  # Slack Integration
  SLACK_CLIENT_ID: "YOUR_SLACK_CLIENT_ID"
  SLACK_URL: "https://slack.com/oauth/v2/authorize"
  SLACK_API_URL: "https://slack.com/api/oauth.v2.access"
