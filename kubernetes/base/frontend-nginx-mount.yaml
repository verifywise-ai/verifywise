apiVersion: apps/v1
kind: Deployment
metadata:
  name: verifywise
spec:
  template:
    spec:
      # Pod-level security context (KSV-0118): runtime-default seccomp profile.
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: nginx-config
          configMap:
            name: frontend-nginx-config
      containers:
        - name: verifywise-frontend
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - NET_BIND_SERVICE
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d
              readOnly: true
