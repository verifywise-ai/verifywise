apiVersion: apps/v1
kind: Deployment
metadata:
  name: verifywise
  namespace: verifywise
spec:
  template:
    spec:
      # Pod-level security context (KSV-0118): runtime-default seccomp profile.
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: nginx-config
          configMap:
            name: frontend-nginx-config
      containers:
        - name: verifywise-frontend
          image: ghcr.io/verifywise-ai/verifywise-frontend:1.7.0
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - NET_BIND_SERVICE
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d
              readOnly: true
