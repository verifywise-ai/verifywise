apiVersion: apps/v1
kind: Deployment
metadata:
  name: verifywise
spec:
  selector:
    matchLabels:
      app: verifywise
  replicas: 1
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: verifywise
    spec:
      automountServiceAccountToken: false
      # Pod-level security context (KSV-0118): runtime-default seccomp profile.
      # Container-level contexts below already drop capabilities and disable
      # privilege escalation; runAsNonRoot is a tracked TODO pending non-root
      # image USER directives (see per-container TODO comments).
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: verifywise-backend
          image: ghcr.io/verifywise-ai/verifywise-backend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
              name: web
              protocol: TCP
          resources: {}
          # TODO: add `runAsNonRoot: true` once Servers/Dockerfile sets a
          # non-root USER (the node:24-alpine3.20 image currently runs as root).
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          envFrom:
            - configMapRef:
                name: verifywise-config
            - secretRef:
                name: verifywise-secret
          env:
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: verifywise-config
                  key: BACKEND_PORT
            - name: DB_HOST
              value: localhost
            - name: DB_USER
              valueFrom:
                configMapKeyRef:
                  name: verifywise-config
                  key: DB_USER
            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: verifywise-config
                  key: DB_PORT
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: verifywise-secret
                  key: DB_PASSWORD
            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: verifywise-config
                  key: DB_NAME
            - name: MOCK_DATA_ON
              valueFrom:
                configMapKeyRef:
                  name: verifywise-config
                  key: MOCK_DATA_ON
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: verifywise-secret
                  key: JWT_SECRET
            - name: SMTP_HOST
              value: smtp.gmail.com
            - name: SMTP_PORT
              value: "587"
            - name: LLM_EVALS_URL
              value: http://localhost:8000
            - name: AI_GATEWAY_URL
              value: http://localhost:8100

        - name: verifywise-worker
          image: ghcr.io/verifywise-ai/verifywise-backend:latest
          imagePullPolicy: Always
          command: ["node", "dist/jobs/worker.js"]
          resources: {}
          envFrom:
            - configMapRef:
                name: verifywise-config
            - secretRef:
                name: verifywise-secret
          env:
            - name: DB_HOST
              value: localhost
            - name: DB_USER
              valueFrom:
                configMapKeyRef:
                  name: verifywise-config
                  key: DB_USER
            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: verifywise-config
                  key: DB_PORT
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: verifywise-secret
                  key: DB_PASSWORD
            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: verifywise-config
                  key: DB_NAME
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: verifywise-secret
                  key: JWT_SECRET
            - name: REDIS_URL
              value: redis://localhost:6379/0
            - name: AI_GATEWAY_URL
              value: http://localhost:8100

        - name: verifywise-frontend
          image: ghcr.io/verifywise-ai/verifywise-frontend:latest
          imagePullPolicy: Always
          resources: {}
          envFrom:
            - configMapRef:
                name: verifywise-config
            - secretRef:
                name: verifywise-secret
          ports:
            - containerPort: 80
              name: web
              protocol: TCP
          # TODO: switch Clients/Dockerfile to nginxinc/nginx-unprivileged (or a
          # non-root nginx variant) and then add `runAsNonRoot: true` here. The
          # current image (nginx:1.31.3-alpine) starts its master process as root.
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              # nginx must bind port 80 as root, so keep NET_BIND_SERVICE.
              add:
                - NET_BIND_SERVICE

        - name: verifywise-redis
          image: redis:7
          imagePullPolicy: Always
          ports:
            - containerPort: 6379
              name: web
              protocol: TCP
          resources: {}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - NET_RAW
            privileged: false
            readOnlyRootFilesystem: false
            seccompProfile:
              type: RuntimeDefault

        - name: verifywise-ai-gateway
          image: ghcr.io/verifywise-ai/verifywise-ai-gateway:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8100
              name: web
              protocol: TCP
          resources: {}
          # TODO: add `runAsNonRoot: true` once AIGateway/Dockerfile sets a
          # non-root USER (the python:3.12-slim image currently runs as root).
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          envFrom:
            - configMapRef:
                name: verifywise-config
            - secretRef:
                name: verifywise-secret
          env:
            - name: DB_HOST
              value: localhost
            - name: DB_USER
              valueFrom:
                configMapKeyRef:
                  name: verifywise-config
                  key: DB_USER
            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: verifywise-config
                  key: DB_PORT
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: verifywise-secret
                  key: DB_PASSWORD
            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: verifywise-config
                  key: DB_NAME
            - name: REDIS_URL
              value: redis://localhost:6379/0
            - name: EXPRESS_BACKEND_URL
              value: http://localhost:3000
            - name: AI_GATEWAY_PORT
              value: "8100"

        - name: verifywise-eval-server
          image: ghcr.io/verifywise-ai/verifywise-eval-server:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
              name: web
              protocol: TCP
          resources: {}
          # TODO: add `runAsNonRoot: true` once EvalServer/Dockerfile sets a
          # non-root USER (the python:3.12-slim image currently runs as root).
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          envFrom:
            - configMapRef:
                name: verifywise-config
            - secretRef:
                name: verifywise-secret
          env:
            - name: DB_HOST
              value: localhost
            - name: DB_USER
              valueFrom:
                configMapKeyRef:
                  name: verifywise-config
                  key: DB_USER
            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: verifywise-config
                  key: DB_PORT
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: verifywise-secret
                  key: DB_PASSWORD
            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: verifywise-config
                  key: DB_NAME
            - name: BACKEND_URL
              value: http://localhost:3000
            - name: REDIS_URL
              value: redis://redis:6379/0
          volumeMounts:
            - name: eval-uploads
              mountPath: /app/data/uploads

        - name: verifywise-postgres-temp
          image: postgres:16.8
          imagePullPolicy: Always
          ports:
            - containerPort: 5432
              name: web
              protocol: TCP
          resources: {}
          securityContext:
            runAsUser: 999
          env:
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: verifywise-config
                  key: DB_NAME
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: verifywise-config
                  key: DB_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: verifywise-secret
                  key: DB_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
      volumes:
        - name: eval-uploads
          persistentVolumeClaim:
            claimName: eval-server-uploads
