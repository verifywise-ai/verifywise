apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-gateway
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "verifywise.labels" . | nindent 4 }}
    component: ai-gateway
spec:
  replicas: {{ .Values.replicas.aiGateway }}
  selector:
    matchLabels:
      {{- include "verifywise.selectorLabels" . | nindent 6 }}
      component: ai-gateway
  template:
    metadata:
      labels:
        {{- include "verifywise.selectorLabels" . | nindent 8 }}
        component: ai-gateway
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: ai-gateway
        image: "{{ .Values.images.aiGateway }}:{{ include "verifywise.imageTag" . }}"
        imagePullPolicy: {{ .Values.images.pullPolicy }}
        ports:
        - containerPort: 8100
          name: http
          protocol: TCP
        env:
        - name: DB_HOST
          valueFrom:
            configMapKeyRef: { name: verifywise-config, key: DB_HOST }
        - name: DB_PORT
          valueFrom:
            configMapKeyRef: { name: verifywise-config, key: DB_PORT }
        - name: DB_USER
          valueFrom:
            secretKeyRef: { name: {{ include "verifywise.secretName" . }}, key: DB_USER }
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef: { name: {{ include "verifywise.secretName" . }}, key: DB_PASSWORD }
        - name: DB_NAME
          valueFrom:
            secretKeyRef: { name: {{ include "verifywise.secretName" . }}, key: DB_NAME }

        - name: REDIS_URL
          valueFrom:
            configMapKeyRef: { name: verifywise-config, key: REDIS_URL }

        - name: AI_GATEWAY_PORT
          valueFrom:
            configMapKeyRef: { name: verifywise-config, key: AI_GATEWAY_PORT }
        - name: AI_GATEWAY_INTERNAL_KEY
          valueFrom:
            secretKeyRef: { name: {{ include "verifywise.secretName" . }}, key: AI_GATEWAY_INTERNAL_KEY }
        - name: ENCRYPTION_KEY
          valueFrom:
            secretKeyRef: { name: {{ include "verifywise.secretName" . }}, key: ENCRYPTION_KEY }
        - name: EXPRESS_BACKEND_URL
          valueFrom:
            configMapKeyRef: { name: verifywise-config, key: EXPRESS_BACKEND_URL }

        livenessProbe:
          httpGet: { path: /health, port: 8100 }
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet: { path: /health, port: 8100 }
          initialDelaySeconds: 15
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
---
apiVersion: v1
kind: Service
metadata:
  name: ai-gateway
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "verifywise.labels" . | nindent 4 }}
    component: ai-gateway
spec:
  type: ClusterIP
  ports:
  - port: 8100
    targetPort: 8100
    protocol: TCP
    name: http
  selector:
    {{- include "verifywise.selectorLabels" . | nindent 4 }}
    component: ai-gateway
