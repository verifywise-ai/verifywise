{{- if .Values.secrets.create }}
{{/*
Auto-generate any secret the user didn't explicitly set. Preserve values
across upgrades by looking up the existing Secret in the target namespace.

Precedence per key:
  1. value from values.yaml (--set / -f), if non-empty
  2. value from existing Secret in the cluster (preserved on upgrade)
  3. freshly generated random value (first install)

Note: `lookup` returns an empty dict during `helm template` (no cluster access),
which is fine — template previews just show fresh randoms. `helm install/upgrade`
against a real cluster gets the real preservation behaviour.
*/}}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace "verifywise-secrets") -}}
{{- $ex := (get (default (dict) $existing) "data") | default (dict) -}}

{{/* Superadmin password: must satisfy validator (lower + upper + digit + ≥8 chars). Prefix "Aa1" guarantees compliance. */}}
{{- $superadminPassword := .Values.secrets.superadmin.password -}}
{{- if not $superadminPassword }}{{ if hasKey $ex "SUPERADMIN_PASSWORD" }}{{ $superadminPassword = index $ex "SUPERADMIN_PASSWORD" | b64dec }}{{ end }}{{ end -}}
{{- if not $superadminPassword }}{{ $superadminPassword = printf "Aa1%s" (randAlphaNum 24) }}{{ end -}}

{{- $dbPassword := .Values.secrets.db.password -}}
{{- if not $dbPassword }}{{ if hasKey $ex "DB_PASSWORD" }}{{ $dbPassword = index $ex "DB_PASSWORD" | b64dec }}{{ end }}{{ end -}}
{{- if not $dbPassword }}{{ $dbPassword = randAlphaNum 32 }}{{ end -}}

{{- $jwtSecret := .Values.secrets.jwtSecret -}}
{{- if not $jwtSecret }}{{ if hasKey $ex "JWT_SECRET" }}{{ $jwtSecret = index $ex "JWT_SECRET" | b64dec }}{{ end }}{{ end -}}
{{- if not $jwtSecret }}{{ $jwtSecret = randAlphaNum 64 }}{{ end -}}

{{- $refreshTokenSecret := .Values.secrets.refreshTokenSecret -}}
{{- if not $refreshTokenSecret }}{{ if hasKey $ex "REFRESH_TOKEN_SECRET" }}{{ $refreshTokenSecret = index $ex "REFRESH_TOKEN_SECRET" | b64dec }}{{ end }}{{ end -}}
{{- if not $refreshTokenSecret }}{{ $refreshTokenSecret = randAlphaNum 64 }}{{ end -}}

{{- $encryptionPassword := .Values.secrets.encryptionPassword -}}
{{- if not $encryptionPassword }}{{ if hasKey $ex "ENCRYPTION_PASSWORD" }}{{ $encryptionPassword = index $ex "ENCRYPTION_PASSWORD" | b64dec }}{{ end }}{{ end -}}
{{- if not $encryptionPassword }}{{ $encryptionPassword = randAlphaNum 32 }}{{ end -}}

{{/* ENCRYPTION_KEY is padded/sliced to 32 chars by the app — give exactly 32. */}}
{{- $encryptionKey := .Values.secrets.encryptionKey -}}
{{- if not $encryptionKey }}{{ if hasKey $ex "ENCRYPTION_KEY" }}{{ $encryptionKey = index $ex "ENCRYPTION_KEY" | b64dec }}{{ end }}{{ end -}}
{{- if not $encryptionKey }}{{ $encryptionKey = randAlphaNum 32 }}{{ end -}}

{{- $aiGatewayInternalKey := .Values.secrets.aiGatewayInternalKey -}}
{{- if not $aiGatewayInternalKey }}{{ if hasKey $ex "AI_GATEWAY_INTERNAL_KEY" }}{{ $aiGatewayInternalKey = index $ex "AI_GATEWAY_INTERNAL_KEY" | b64dec }}{{ end }}{{ end -}}
{{- if not $aiGatewayInternalKey }}{{ $aiGatewayInternalKey = randAlphaNum 48 }}{{ end -}}

{{- $evalServerInternalKey := .Values.secrets.evalServerInternalKey -}}
{{- if not $evalServerInternalKey }}{{ if hasKey $ex "EVAL_SERVER_INTERNAL_KEY" }}{{ $evalServerInternalKey = index $ex "EVAL_SERVER_INTERNAL_KEY" | b64dec }}{{ end }}{{ end -}}
{{- if not $evalServerInternalKey }}{{ $evalServerInternalKey = randAlphaNum 48 }}{{ end -}}
---
apiVersion: v1
kind: Secret
metadata:
  name: verifywise-secrets
  labels:
    {{- include "verifywise.labels" . | nindent 4 }}
type: Opaque
stringData:
  # Super-admin (seeded on first boot)
  SUPERADMIN_EMAIL: {{ .Values.secrets.superadmin.email | quote }}
  SUPERADMIN_PASSWORD: {{ $superadminPassword | quote }}

  # Database
  DB_USER: {{ .Values.secrets.db.user | quote }}
  DB_PASSWORD: {{ $dbPassword | quote }}
  DB_NAME: {{ .Values.secrets.db.name | quote }}

  # JWT
  JWT_SECRET: {{ $jwtSecret | quote }}
  REFRESH_TOKEN_SECRET: {{ $refreshTokenSecret | quote }}

  # Encryption
  ENCRYPTION_ALGORITHM: {{ .Values.secrets.encryptionAlgorithm | quote }}
  ENCRYPTION_PASSWORD: {{ $encryptionPassword | quote }}
  ENCRYPTION_KEY: {{ $encryptionKey | quote }}

  # Service-to-service
  AI_GATEWAY_INTERNAL_KEY: {{ $aiGatewayInternalKey | quote }}
  EVAL_SERVER_INTERNAL_KEY: {{ $evalServerInternalKey | quote }}

  # Optional integrations
  RESEND_API_KEY: {{ .Values.secrets.resendApiKey | quote }}
  SMTP_PASS: {{ .Values.secrets.smtpPass | quote }}
  EXCHANGE_ONLINE_PASS: {{ .Values.secrets.exchangeOnlinePass | quote }}
  SLACK_CLIENT_SECRET: {{ .Values.secrets.slackClientSecret | quote }}
  SLACK_BOT_TOKEN: {{ .Values.secrets.slackBotToken | quote }}
{{- end }}
