---
- name: Update VerifyWise on all servers (images + compose + env)
  hosts: verifywise
  become: true

  tasks:
    - name: Detect available Compose command (v2 plugin or legacy binary)
      ansible.builtin.shell: |
        if docker compose version >/dev/null 2>&1; then
          echo "docker compose"
        elif command -v docker-compose >/dev/null 2>&1; then
          echo "docker-compose"
        else
          echo "MISSING"
          exit 1
        fi
      register: compose_detect
      changed_when: false

    - name: Set compose_cmd fact
      ansible.builtin.set_fact:
        compose_cmd: "{{ compose_detect.stdout }}"

    - name: Read existing .env.prod from server
      ansible.builtin.slurp:
        src: "{{ install_dir }}/.env.prod"
      register: existing_env

    - name: Preserve existing secrets and DB creds (don't regenerate on update)
      ansible.builtin.set_fact:
        db_host: "{{ existing_env.content | b64decode | regex_search('^DB_HOST=(.*)$', '\\1', multiline=True) | first }}"
        db_port: "{{ existing_env.content | b64decode | regex_search('^DB_PORT=(.*)$', '\\1', multiline=True) | first }}"
        db_name: "{{ existing_env.content | b64decode | regex_search('^DB_NAME=(.*)$', '\\1', multiline=True) | first }}"
        db_user: "{{ existing_env.content | b64decode | regex_search('^DB_USER=(.*)$', '\\1', multiline=True) | first }}"
        db_password: "{{ existing_env.content | b64decode | regex_search('^DB_PASSWORD=(.*)$', '\\1', multiline=True) | first }}"
        superadmin_password: "{{ existing_env.content | b64decode | regex_search('^SUPERADMIN_PASSWORD=(.*)$', '\\1', multiline=True) | first }}"
        jwt_secret: "{{ existing_env.content | b64decode | regex_search('^JWT_SECRET=(.*)$', '\\1', multiline=True) | first }}"
        refresh_token_secret: "{{ existing_env.content | b64decode | regex_search('^REFRESH_TOKEN_SECRET=(.*)$', '\\1', multiline=True) | first }}"
        # Missing line -> '' so the check below can explain it, instead of a Jinja error.
        # A value passed with -e encryption_key=... wins over this (extra vars beat set_fact).
        encryption_key: "{{ existing_env.content | b64decode | regex_search('^ENCRYPTION_KEY=(.*)$', '\\1', multiline=True) | default([''], true) | first }}"
        # Optional; kept so a pinned token hash secret survives the re-render below.
        api_token_hash_secret: "{{ existing_env.content | b64decode | regex_search('^API_TOKEN_HASH_SECRET=(.*)$', '\\1', multiline=True) | default([''], true) | first }}"
        ai_gateway_internal_key: "{{ existing_env.content | b64decode | regex_search('^AI_GATEWAY_INTERNAL_KEY=(.*)$', '\\1', multiline=True) | first }}"
        eval_server_internal_key: "{{ existing_env.content | b64decode | regex_search('^EVAL_SERVER_INTERNAL_KEY=(.*)$', '\\1', multiline=True) | default([''], true) | first | default(lookup('password', '/dev/null length=32 chars=ascii_letters,digits'), true) }}"
        encryption_password: "{{ existing_env.content | b64decode | regex_search('^ENCRYPTION_PASSWORD=(.*)$', '\\1', multiline=True) | default([''], true) | first | default(lookup('password', '/dev/null length=32 chars=ascii_letters,digits'), true) }}"

    # The backend and worker refuse to start in production without ENCRYPTION_KEY
    # (Servers/utils/encryption.utils.ts). Stop before anything on the server changes.
    - name: Require ENCRYPTION_KEY before updating
      ansible.builtin.assert:
        that:
          - encryption_key | string | trim | regex_replace('^([\"\'])(.*)\\1$', '\\2') | trim | length > 0
        quiet: true
        fail_msg: |
          ENCRYPTION_KEY is missing or empty in {{ install_dir }}/.env.prod on {{ inventory_hostname }}.
          Nothing on this server was changed. VerifyWise refuses to start in production without it.
          Add ENCRYPTION_KEY to that .env.prod (no quotes), or re-run for this server only:
            --limit {{ inventory_hostname }} -e 'encryption_key=<value>'
          Keep --limit: -e applies to every host and would replace other servers' keys.
          Keep the single quotes: the old default key ends in !!, which a shell would expand.
          - Install that ran without ENCRYPTION_KEY: its stored credentials were encrypted with the
            old default key. Use default-key-change-this-in-production-32chars!! to keep them readable.
          - New key: openssl rand -base64 32 (stored credentials must then be saved again).
          Before rotating ENCRYPTION_KEY later: if API_TOKEN_HASH_SECRET is unset, add it to .env.prod
          with the current ENCRYPTION_KEY value first (updates keep it), or every API and MCP token
          stops working.

    - name: Sync docker-compose files from local repo
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../{{ item }}"
        dest: "{{ install_dir }}/{{ item }}"
        mode: "0644"
      loop:
        - docker-compose.yml
        - docker-compose.prod.yml

    - name: Re-render .env.prod (fixed vars updated, secrets preserved)
      ansible.builtin.template:
        src: .env.j2
        dest: "{{ install_dir }}/.env.prod"
        mode: "0600"

    - name: Pull latest images
      ansible.builtin.shell: "{{ compose_cmd }} -f docker-compose.yml -f docker-compose.prod.yml --env-file .env.prod pull"
      args:
        chdir: "{{ install_dir }}"
      environment:
        IMAGE_TAG: "{{ image_tag | default('latest') }}"
      changed_when: true

    - name: Recreate containers with new images / config
      ansible.builtin.shell: "{{ compose_cmd }} -f docker-compose.yml -f docker-compose.prod.yml --env-file .env.prod up -d"
      args:
        chdir: "{{ install_dir }}"
      environment:
        IMAGE_TAG: "{{ image_tag | default('latest') }}"
      register: compose_up
      changed_when: "'Recreated' in compose_up.stderr or 'Started' in compose_up.stderr"

    - name: Wait for backend health endpoint
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ backend_port }}/health/ready"
        method: GET
        status_code: 200
      register: result
      until: result.status == 200
      retries: 24
      delay: 5

    - name: Prune unused images
      ansible.builtin.command: docker image prune -f
      changed_when: false
