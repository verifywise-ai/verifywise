# ---- Fixed variables (edit these as needed) ----
install_dir: /verifywise

# App
backend_port: 3000
frontend_port: 8080
node_env: production
multi_tenancy_enabled: "false"

# Shadow AI syslog listener (TCP, off by default). Quote the booleans: only the
# string "true" turns a flag on. Enabling also needs a TLS certificate and key
# (set the two *_file paths) or shadow_ai_syslog_allow_plaintext: "true", and
# the container port published; see docs/technical/infrastructure/shadow-ai-syslog.md.
shadow_ai_syslog_enabled: "false"
shadow_ai_syslog_port: "6514"
shadow_ai_syslog_allow_plaintext: "false"
shadow_ai_syslog_allow_ip_only: "false"
shadow_ai_syslog_tls_cert_file: ""
shadow_ai_syslog_tls_key_file: ""

# Database
db_host: postgresdb
db_port: 5432
db_name: verifywise
db_user: verifywise

# Super-admin (password is randomized below)
superadmin_email: admin@verifywise.ai

# SSL / Let's Encrypt
certbot_email: admin@verifywise.ai

# ---- Randomized secrets ----
# Generated fresh on every playbook run (not persisted).
# Defined as set_fact in install.yml so values stay stable within a single run.
