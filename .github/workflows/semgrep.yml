name: SAST (Semgrep)

# Static application security testing with Semgrep Community Edition.
# Completes the recommended free AppSec stack: Semgrep (SAST) + ZAP (DAST)
# + Trivy (SCA/images/IaC).
#
# Rulesets:
#   p/javascript + p/typescript — injection, XSS, crypto, SSRF (A01/A04/A05)
#   p/python                   — Bandit-class findings for the FastAPI services
#   p/security-audit           — cross-language security patterns
#   p/secrets                  — hardcoded secret patterns
#
# On pull requests, findings are printed to the job log (rule, file:line,
# message) and also uploaded as SARIF to the GitHub Security tab. The scan is an
# enforced blocking gate — but only for NEW findings. The pre-existing
# findings backlog is triaged separately (tracked outside CI); blocking on it
# would fail every PR. Semgrep's built-in baseline diffing
# (--baseline-commit) fails the job only on findings not present on the PR
# base branch. On push events there is no base ref, so the full scan still
# runs (SARIF keeps the backlog visible in the Security tab) but does not
# fail the job and does not print the backlog to the log — full-history
# triage pending; the PR gate is the enforcement point. fetch-depth: 0 below
# is required so the baseline commit is available locally.
#
# The Semgrep engine is pinned (SEMGREP_VERSION) so an upstream engine
# release cannot break the job between two otherwise identical runs; bump it
# deliberately. The rulesets (p/...) are still fetched from the Semgrep
# registry on every run, so a rule change upstream can still add a finding on
# lines a PR touches. pip retries with a longer timeout because transient
# PyPI download timeouts were the most common infra failure. Metrics
# reporting to Semgrep is disabled.

permissions:
  contents: read
  security-events: write

on:
  pull_request:
    branches: [master, develop]
  push:
    branches: [master, develop]
  workflow_dispatch:

jobs:
  semgrep:
    name: Semgrep SAST scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history so the action can diff against the PR base commit.
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # The semgrep-action@v1 is deprecated and rejects the generateSarif /
      # baselineRef inputs, so it never produced semgrep.sarif and the upload
      # step failed. Run the Semgrep CLI directly: on pull requests it prints
      # new findings to the log and writes SARIF; on push it writes SARIF
      # only. It blocks on findings via its own exit code.
      - name: Run Semgrep
        env:
          SEMGREP_VERSION: '1.178.0'
          # Passed through env, never interpolated into the script.
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          python3 -m pip install --quiet --retries 5 --timeout 60 "semgrep==${SEMGREP_VERSION}"
          RULES="--config p/javascript --config p/typescript --config p/python --config p/security-audit --config p/secrets --metrics off"
          if [ "$EVENT_NAME" = "pull_request" ]; then
            # PR gate: fails only on findings not present on the base branch,
            # and prints them to this log as well as writing SARIF.
            semgrep scan $RULES --sarif-output=semgrep.sarif --error --baseline-commit "origin/$BASE_REF"
          else
            # Push: full scan, non-blocking. SARIF only, so the whole backlog
            # is not printed to the log on every merge; genuine scan errors
            # still fail the job.
            semgrep scan $RULES --sarif --output semgrep.sarif
          fi

      - name: Upload Semgrep results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        # Only when a SARIF file exists and the run was not cancelled: if the
        # install or scan never ran, skip the upload instead of adding a
        # second, misleading failure.
        if: ${{ !cancelled() && hashFiles('semgrep.sarif') != '' }}
        with:
          sarif_file: semgrep.sarif
          category: 'semgrep-sast'
