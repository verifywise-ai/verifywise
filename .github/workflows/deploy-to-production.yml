name: Deploy to Production

on:
  workflow_run:
    workflows: ["Build and Push Images to GitHub Container Registry"]
    types:
      - completed

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment: Build

    steps:
      # (#4685) Record the image tags that are live BEFORE we overwrite them.
      # The deploy step below force-removes the previous local images
      # (`docker rmi -f`), so rollback cannot rely on the old image still
      # being on the host — the ghcr tags recorded here are the only
      # rollback reference. Persisted on the server and pulled back as a
      # workflow artifact by post-deploy-smoke.
      - name: Record currently deployed image tags
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            cd /root/verifywise/_saas_deployment
            docker ps --format '{{.Image}}' \
              | grep -E 'ghcr.io/verifywise-ai/verifywise-(backend|frontend):' \
              | sed -E 's|ghcr.io/verifywise-ai/verifywise-(backend\|frontend):(.+)|\1 ghcr.io/verifywise-ai/verifywise-\1:\2|' \
              | sort -u > /tmp/previous-image-tags.txt || true
            echo "Previous image tags:"
            cat /tmp/previous-image-tags.txt || echo "(none recorded — first deploy?)"

      - name: Deploy to Production
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            cd /root/verifywise/_saas_deployment
            docker-compose --env-file .env.prod down
            docker images --format "table {{.Repository}}:{{.Tag}}\t{{.ID}}" | grep -v -E "(redis|postgres|admin)" | awk 'NR>1 {print $2}' | xargs -r docker rmi -f || true
            ./install.sh

  # (#4685) Post-deploy gate: verify the freshly deployed production is
  # actually serving before declaring the release done, then run the canary
  # critical journey (Clients/e2e/canary, @canary tag) against it.
  post-deploy-smoke:
    name: Post-deploy smoke gate
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: Build

    steps:
      - uses: actions/checkout@v7

      # Backend /health/ready covers the backend's own data stores
      # (PostgreSQL + Redis) and returns 503 when degraded — see Servers/app.ts.
      # Retry for up to ~3 minutes: containers need time to come up after
      # docker-compose down/up, and migrations may run on boot.
      - name: Smoke check backend /health/ready
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
        run: |
          for i in $(seq 1 18); do
            BODY=$(curl -fsS --max-time 10 "https://${PROD_HOST}/health/ready" 2>/dev/null) && \
            echo "$BODY" | grep -q '"status":"ok"' && \
            { echo "Backend healthy: $BODY"; exit 0; }
            echo "Attempt $i/18: backend not healthy yet, retrying in 10s..."
            sleep 10
          done
          echo "::error::Backend /health/ready did not report ok within 3 minutes."
          exit 1

      # (#4685) The canary needs a dedicated smoke-test account on prod. Until
      # the PROD_E2E_EMAIL / PROD_E2E_PASSWORD secrets exist, skip the canary
      # but still gate on the /health/ready check above — missing credentials
      # must never trigger a rollback.
      - name: Check canary credentials
        id: canary-creds
        env:
          PROD_E2E_EMAIL: ${{ secrets.PROD_E2E_EMAIL }}
        run: |
          if [ -n "$PROD_E2E_EMAIL" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::PROD_E2E_EMAIL secret not set - skipping canary (set it to enable the full post-deploy gate)."
          fi

      # Canary critical journey. The `canary` Playwright project ships in
      # this PR (Clients/e2e/canary/canary.spec.ts) - do NOT edit Clients/ here.
      - name: Set up Node
        if: steps.canary-creds.outputs.available == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: Clients/package-lock.json

      - name: Install frontend dependencies
        if: steps.canary-creds.outputs.available == 'true'
        working-directory: Clients
        run: npm ci --legacy-peer-deps

      - name: Install Playwright browsers
        if: steps.canary-creds.outputs.available == 'true'
        working-directory: Clients
        run: npx playwright install --with-deps chromium

      - name: Run canary suite against production
        if: steps.canary-creds.outputs.available == 'true'
        working-directory: Clients
        env:
          # E2E_BASE_URL is read by the Playwright config / canary spec.
          E2E_BASE_URL: https://${{ secrets.PROD_HOST }}
          E2E_EMAIL: ${{ secrets.PROD_E2E_EMAIL }}
          E2E_PASSWORD: ${{ secrets.PROD_E2E_PASSWORD }}
        run: npx playwright test --project=canary --grep @canary

      - name: Upload canary report
        if: always() && steps.canary-creds.outputs.available == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: post-deploy-canary-report
          path: Clients/playwright-report/
          retention-days: 14

      # Pull the pre-deploy image tags (written to the server by the deploy
      # job) down into a workflow artifact so a human can roll back
      # immediately without waiting for this workflow's logs.
      - name: Fetch previous image tags (rollback reference)
        if: always()
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_USER: ${{ secrets.PROD_USER }}
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
        run: |
          mkdir -p rollback
          install -m 600 /dev/null /tmp/prod_ssh_key
          printf '%s\n' "$PROD_SSH_KEY" > /tmp/prod_ssh_key
          ssh -o StrictHostKeyChecking=no -i /tmp/prod_ssh_key \
            "$PROD_USER@$PROD_HOST" "cat /tmp/previous-image-tags.txt" \
            > rollback/previous-image-tags.txt 2>/dev/null || true
          rm -f /tmp/prod_ssh_key
          cat rollback/previous-image-tags.txt || echo "(no previous tags recorded)"

      - name: Upload previous image tags artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: previous-image-tags
          path: rollback/previous-image-tags.txt
          if-no-files-found: ignore
          retention-days: 30

  # (#4685) Automatic rollback, consistent with the deploy mechanism: the app
  # runs as ghcr images orchestrated by docker-compose on the prod host, so
  # rollback = re-point :latest at the pre-deploy tags recorded before deploy
  # (ghcr retains every pushed tag, which survives the deploy step's local
  # `docker rmi`) and bring the stack back up. Runs only when the smoke gate
  # failed — a green canary never triggers this.
  rollback:
    name: Rollback to previous images
    needs: post-deploy-smoke
    if: ${{ failure() }}
    runs-on: ubuntu-latest
    environment: Build

    steps:
      - name: Rollback to previous image tags
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            cd /root/verifywise/_saas_deployment
            if [ ! -s /tmp/previous-image-tags.txt ]; then
              echo "::error::No previous image tags recorded — cannot auto-rollback. Roll back manually."
              exit 1
            fi
            cat /tmp/previous-image-tags.txt
            while read -r service image; do
              [ -n "$image" ] || continue
              echo "Rolling back $service to $image"
              docker pull "$image"
              # install.sh deploys :latest — re-tag the previous release as
              # latest so the standard compose flow comes up on the old build.
              docker tag "$image" "ghcr.io/verifywise-ai/verifywise-${service}:latest"
            done < /tmp/previous-image-tags.txt
            docker-compose --env-file .env.prod up -d
            echo "Rollback applied — verify with: curl https://localhost/health/ready (from the host)"
