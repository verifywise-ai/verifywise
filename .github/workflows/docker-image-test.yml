name: Build and Deploy to Testing

on:
  schedule:
    # Run every hour
    - cron: '0 * * * *'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: Build

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: develop

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The frontend Dockerfile intentionally copies only package.json (not the
      # lockfile) and runs `npm install` fresh for musl platform binaries, so the
      # BuildKit layer cache cannot see dependency changes on its own. Scope the
      # GHA cache by the lockfile hash instead: a lockfile change switches to a
      # fresh scope (full rebuild with new deps), while an unchanged lockfile
      # hits the cache. The plain `clients` scope is a rolling fallback.
      - name: Hash Clients lockfile for cache scope
        id: clients-lock
        run: echo "hash=$(sha256sum Clients/package-lock.json | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Build and push Clients image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Clients/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/verifywise-frontend:test
          cache-from: |
            type=gha,scope=clients-${{ steps.clients-lock.outputs.hash }}
            type=gha,scope=clients
          cache-to: type=gha,mode=max,scope=clients-${{ steps.clients-lock.outputs.hash }}
          build-args: |
            VITE_SLACK_CLIENT_ID=${{ secrets.SLACK_CLIENT_ID }}
            VITE_APP_VERSION=develop

      - name: Copy version.json into Servers context
        run: cp version.json Servers/version.json

      - name: Build and push Servers image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Servers/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/verifywise-backend:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push EvalServer image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./EvalServer/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/verifywise-eval-server:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push AIGateway image
        uses: docker/build-push-action@v7
        with:
          context: ./AIGateway
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/verifywise-ai-gateway:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Nightly informational Trivy scans of the pushed :test images.
      # Non-blocking (exit-code 0); results go to the job summary.
      - name: Scan Frontend test image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'ghcr.io/${{ github.repository_owner }}/verifywise-frontend:test'
          format: 'table'
          output: 'frontend-trivy-results.txt'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'
          ignore-unfixed: true

      - name: Scan Backend test image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'ghcr.io/${{ github.repository_owner }}/verifywise-backend:test'
          format: 'table'
          output: 'backend-trivy-results.txt'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'
          ignore-unfixed: true

      - name: Scan EvalServer test image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'ghcr.io/${{ github.repository_owner }}/verifywise-eval-server:test'
          format: 'table'
          output: 'evalserver-trivy-results.txt'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'
          ignore-unfixed: true

      - name: Scan AIGateway test image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'ghcr.io/${{ github.repository_owner }}/verifywise-ai-gateway:test'
          format: 'table'
          output: 'aigateway-trivy-results.txt'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'
          ignore-unfixed: true

      - name: Add Trivy results to job summary
        if: always()
        run: |
          for f in frontend backend evalserver aigateway; do
            echo "## Trivy scan — $f:test" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            cat "$f-trivy-results.txt" >> "$GITHUB_STEP_SUMMARY" || true
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Deploy to Testing
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.TEST_HOST }}
          username: ${{ secrets.TEST_USER }}
          key: ${{ secrets.TEST_SSH_KEY }}
          script: |
            cd /root/verifywise/_saas_deployment
            docker-compose --env-file .env.prod down
            docker-compose -f docker-compose.yml -f docker-compose.prod.yml --env-file .env.prod pull
            ./install.sh
