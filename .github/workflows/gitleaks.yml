name: Secret Scanning (Gitleaks)

on:
  pull_request:
    branches: [master, develop]
  push:
    branches: [master, develop]
  workflow_dispatch:
  schedule:
    # (#4686-b) Weekly full-history scan, Sundays 02:00 UTC — complements the
    # PR-triggered tree scan below by auditing the ENTIRE git history for
    # secrets that were committed and later removed from the working tree.
    - cron: '0 2 * * 0'

permissions:
  contents: read

jobs:
  gitleaks:
    name: Scan for committed secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history so gitleaks can scan the commit range

      # The gitleaks GitHub Action (v2) requires a paid GITLEAKS_LICENSE secret
      # for organization repositories. Run the open-source gitleaks binary
      # directly instead — same detection engine, no license gate.
      - name: Install gitleaks
        run: |
          GITLEAKS_VERSION=8.21.2
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      # Scan the checked-out tree (--no-git) rather than full history: the goal
      # is to block secrets present in the current code. Historical commits that
      # have already been remediated should not fail every future run. A
      # committed .gitleaks.toml can tune rules/allowlists if needed.
      # Pass the repo-root .gitleaks.toml explicitly (gitleaks would
      # auto-detect it in the source dir, but explicit is clearer and immune
      # to working-directory changes). It extends the default ruleset and
      # allowlists documented false positives (test fixtures, docs snippets,
      # example manifests, detection-pattern literals).
      - name: Scan for secrets
        run: gitleaks detect --no-git --source . --config .gitleaks.toml --redact --verbose --exit-code 1

  # (#4686-b) Full-history scan: every commit, not just the current tree. The
  # PR job above deliberately uses --no-git so remediated history never fails
  # future runs; this scheduled job is where historical leaks are found.
  # Same gitleaks version and .gitleaks.toml as the PR job; findings are
  # report-only (exit-code 0) because historical findings require triage and
  # credential rotation, not a red CI. Findings must still be treated as
  # live until rotated: a secret in history is a secret.
  gitleaks-full-history:
    name: Scan full git history for secrets
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history is the point of this job

      - name: Install gitleaks
        run: |
          GITLEAKS_VERSION=8.21.2
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      # Log-opts limits the scan to commits reachable from the default branch,
      # avoiding duplicate findings on merged PR heads.
      - name: Scan full history for secrets
        run: gitleaks detect --source . --config .gitleaks.toml --redact --verbose --report-path gitleaks-full-history.json --exit-code 0 --log-opts="--all"

      - name: Summarize findings
        run: |
          if [ -s gitleaks-full-history.json ]; then
            COUNT=$(grep -c '"Fingerprint"' gitleaks-full-history.json || true)
            echo "::warning::gitleaks full-history scan found ${COUNT} finding(s) — triage and rotate affected credentials."
          else
            echo "No historical secrets found."
          fi

      - name: Upload full-history report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gitleaks-full-history-report
          path: gitleaks-full-history.json
          if-no-files-found: ignore
          retention-days: 90
