name: Backend Checks

permissions:
  contents: read
  security-events: write
  pull-requests: write

on:
  pull_request:
    branches: ["master", "develop"]
    paths:
      - "Servers/**"
  push:
    branches: ["master", "develop"]
    paths:
      - "Servers/**"

jobs:
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Servers

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Run npm audit (JSON output for review)
        run: npm audit --json > ../audit-results.json || true

      - name: Upload audit results
        uses: actions/upload-artifact@v7
        with:
          name: backend-npm-audit-results
          path: audit-results.json
          retention-days: 30

  lint-and-build:
    name: Lint and Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Servers

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Get changed files
        id: changed-files
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "files=$(git diff --name-only --diff-filter=ACMRT origin/${{ github.base_ref }}...HEAD | grep '^Servers/' | sed 's|^Servers/||' | grep -E '\.(ts|tsx|js|jsx|json|md)$' | tr '\n' ' ')" >> "$GITHUB_OUTPUT"
          else
            echo "files=$(git diff --name-only --diff-filter=ACMRT HEAD~1 HEAD | grep '^Servers/' | sed 's|^Servers/||' | grep -E '\.(ts|tsx|js|jsx|json|md)$' | tr '\n' ' ')" >> "$GITHUB_OUTPUT"
          fi

      - name: Prettier format check
        if: steps.changed-files.outputs.files != ''
        run: npx prettier --check ${{ steps.changed-files.outputs.files }}

      - name: TypeScript type check
        run: npm run build

      - name: Run tests
        run: npm test

      - name: i18n audit (catch dictionary drift)
        run: npm run i18n:audit:strict

      - name: API documentation drift check
        run: npm run check:api-drift

      - name: Dependency vulnerability audit
        run: |
          npm audit --audit-level=high --omit=dev || true
          node $GITHUB_WORKSPACE/scripts/security/npm-audit-gate.js .

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage-report
          path: Servers/coverage/
          retention-days: 14
          if-no-files-found: ignore

  tenant-isolation-tests:
    name: Tenant Isolation Integration Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Servers

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Run tenant-isolation integration matrix
        env:
          DB_HOST: localhost
          DB_PORT: "5432"
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_NAME: verifywise_test
          NODE_ENV: test
          SUPERADMIN_EMAIL: super@local.dev
          SUPERADMIN_PASSWORD: Super123!
          JWT_SECRET: test-jwt-secret-key-for-testing-only
          REFRESH_TOKEN_SECRET: test-refresh-secret-key-for-testing-only
          ENCRYPTION_KEY: default-key-change-this-in-production-32chars!!
          # Required by the RLS runtime-role migration (rls-app-role.js), run via
          # globalSetup; it fails closed without it. CI-only value.
          DB_APP_PASSWORD: test-app-role-password-for-ci
        run: npm run test:integration -- --testPathPatterns=tenant-isolation

      - name: Run deadline-summary smoke test
        env:
          DB_HOST: localhost
          DB_PORT: "5432"
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_NAME: verifywise_test
          NODE_ENV: test
          SUPERADMIN_EMAIL: super@local.dev
          SUPERADMIN_PASSWORD: Super123!
          JWT_SECRET: test-jwt-secret-key-for-testing-only
          REFRESH_TOKEN_SECRET: test-refresh-secret-key-for-testing-only
          ENCRYPTION_KEY: default-key-change-this-in-production-32chars!!
          # Required by the RLS runtime-role migration (rls-app-role.js), run via
          # globalSetup; it fails closed without it. CI-only value.
          DB_APP_PASSWORD: test-app-role-password-for-ci
        run: npm run test:smoke

      - name: Run schema-drift tenant isolation audit
        env:
          DB_HOST: localhost
          DB_PORT: "5432"
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_NAME: verifywise_test
          NODE_ENV: test
          SUPERADMIN_EMAIL: super@local.dev
          SUPERADMIN_PASSWORD: Super123!
          JWT_SECRET: test-jwt-secret-key-for-testing-only
          REFRESH_TOKEN_SECRET: test-refresh-secret-key-for-testing-only
          ENCRYPTION_KEY: default-key-change-this-in-production-32chars!!
          # Required by the RLS runtime-role migration (rls-app-role.js), run via
          # globalSetup; it fails closed without it. CI-only value.
          DB_APP_PASSWORD: test-app-role-password-for-ci
        run: npx ts-node scripts/auditTenantIsolationCoverage.ts

  coverage:
    name: Coverage Gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Servers

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage-report
          path: Servers/coverage/
          retention-days: 14

      - name: Post coverage gate comment on PR
        if: github.event_name == 'pull_request' && failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const summaryPath = "Servers/coverage/coverage-summary.json";
            if (!fs.existsSync(summaryPath)) {
              console.log("coverage-summary.json not found, skipping comment");
              return;
            }
            const json = JSON.parse(fs.readFileSync(summaryPath, "utf8"));
            const total = json.total;
            const threshold = { statements: 30, branches: 25, functions: 25, lines: 40 };
            const rows = ["| Metric | Threshold | Actual | Status |", "|--------|----------:|------:|:------:|"];
            let passed = true;
            for (const key of ["statements", "branches", "functions", "lines"]) {
              const actual = total[key].pct;
              const ok = actual >= threshold[key];
              if (!ok) passed = false;
              rows.push(`| ${key.charAt(0).toUpperCase() + key.slice(1)} | ${threshold[key]}% | ${actual}% | ${ok ? "✅" : "❌"} |`);
            }

            if (passed) {
              console.log("All coverage thresholds pass");
              return;
            }

            const body = `## Coverage Gate Failed\n\n${rows.join("\n")}\n\n<!-- coverage-gate -->`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const marker = "<!-- coverage-gate -->";
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7

      - name: Dependency Review
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          deny-licenses: GPL-3.0, AGPL-3.0
          allow-ghsas: GHSA-mh99-v99m-4gvg
