name: Backend Checks

permissions:
  contents: read
  security-events: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches: ["master", "develop"]
    paths:
      - "Servers/**"
      - ".github/workflows/backend-checks.yml"
  push:
    branches: ["master", "develop"]
    paths:
      - "Servers/**"
      - ".github/workflows/backend-checks.yml"

jobs:
  lint-and-build:
    name: Lint and Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: Servers

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: Servers/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Get changed files
        id: changed-files
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "files=$(git diff --name-only --diff-filter=ACMRT origin/${{ github.base_ref }}...HEAD | grep '^Servers/' | sed 's|^Servers/||' | grep -E '\.(ts|tsx|js|jsx|json|md)$' | tr '\n' ' ')" >> "$GITHUB_OUTPUT"
          else
            echo "files=$(git diff --name-only --diff-filter=ACMRT HEAD~1 HEAD | grep '^Servers/' | sed 's|^Servers/||' | grep -E '\.(ts|tsx|js|jsx|json|md)$' | tr '\n' ' ')" >> "$GITHUB_OUTPUT"
          fi

      - name: Prettier format check
        if: steps.changed-files.outputs.files != ''
        run: npx prettier --check ${{ steps.changed-files.outputs.files }}

      - name: TypeScript type check
        run: npm run build

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: i18n audit (catch dictionary drift)
        run: npm run i18n:audit:strict

      - name: API documentation drift check
        run: npm run check:api-drift

      - name: Dependency vulnerability audit
        run: npm audit --audit-level=high --omit=dev

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage-report
          path: Servers/coverage/
          retention-days: 14
          if-no-files-found: ignore

  tenant-isolation-tests:
    name: Tenant Isolation Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: Servers

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: Servers/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tenant-isolation integration matrix
        env:
          DB_HOST: localhost
          DB_PORT: "5432"
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_NAME: verifywise_test
          NODE_ENV: test
          SUPERADMIN_EMAIL: super@local.dev
          SUPERADMIN_PASSWORD: Super123!
          JWT_SECRET: test-jwt-secret-key-for-testing-only
          REFRESH_TOKEN_SECRET: test-refresh-secret-key-for-testing-only
          ENCRYPTION_KEY: default-key-change-this-in-production-32chars!!
          # Required by the RLS runtime-role migration (rls-app-role.js), run via
          # globalSetup; it fails closed without it. CI-only value.
          DB_APP_PASSWORD: test-app-role-password-for-ci
        run: npm run test:integration -- --testPathPatterns=tenant-isolation

      - name: Run deadline-summary smoke test
        env:
          DB_HOST: localhost
          DB_PORT: "5432"
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_NAME: verifywise_test
          NODE_ENV: test
          SUPERADMIN_EMAIL: super@local.dev
          SUPERADMIN_PASSWORD: Super123!
          JWT_SECRET: test-jwt-secret-key-for-testing-only
          REFRESH_TOKEN_SECRET: test-refresh-secret-key-for-testing-only
          ENCRYPTION_KEY: default-key-change-this-in-production-32chars!!
          # Required by the RLS runtime-role migration (rls-app-role.js), run via
          # globalSetup; it fails closed without it. CI-only value.
          DB_APP_PASSWORD: test-app-role-password-for-ci
        run: npm run test:smoke

      - name: Run schema-drift tenant isolation audit
        env:
          DB_HOST: localhost
          DB_PORT: "5432"
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_NAME: verifywise_test
          NODE_ENV: test
          SUPERADMIN_EMAIL: super@local.dev
          SUPERADMIN_PASSWORD: Super123!
          JWT_SECRET: test-jwt-secret-key-for-testing-only
          REFRESH_TOKEN_SECRET: test-refresh-secret-key-for-testing-only
          ENCRYPTION_KEY: default-key-change-this-in-production-32chars!!
          # Required by the RLS runtime-role migration (rls-app-role.js), run via
          # globalSetup; it fails closed without it. CI-only value.
          DB_APP_PASSWORD: test-app-role-password-for-ci
        run: npx ts-node scripts/auditTenantIsolationCoverage.ts

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7

      - name: Dependency Review
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          deny-licenses: GPL-3.0, AGPL-3.0
