name: Backend Checks

permissions:
  contents: read
  security-events: write
  pull-requests: write

on:
  pull_request:
    branches: ["master", "develop"]
    paths:
      - "Servers/**"
      - ".github/workflows/backend-checks.yml"
      - "scripts/security/**"
  push:
    branches: ["master", "develop"]
    paths:
      - "Servers/**"
      - ".github/workflows/backend-checks.yml"
      - "scripts/security/**"
  # Nightly full run on develop. A push to develop runs only the quick checks
  # (the PR already ran the database suites and the coverage gate), so this is
  # what catches two PRs that pass alone but break together.
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:

# The org's Free plan runs at most 20 jobs at once, so every job here also
# makes other PRs wait. A newer push to the same PR cancels the older run.
# Every other run (push, nightly, manual) gets a group of its own commit and
# event, so it neither cancels nor replaces a queued run of another commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Quick checks share one job (and one npm ci): as separate jobs, each spent
  # longer waiting for a runner than running.
  lint-and-build:
    name: Lint and Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Servers

    # Each check runs as long as npm ci succeeded, even after an earlier check
    # failed, so one run reports every failure (as separate jobs did).
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: Servers/package-lock.json

      - name: Install dependencies
        id: install
        run: npm ci

      # Runs before the build so the diff below sees only what the generators
      # changed.
      - name: Regenerate OpenAPI spec and endpoint registry
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          npm run generate:swagger
          npm run generate:endpoints

      - name: Fail if the committed generated files are stale
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          git diff --exit-code -- swagger.yaml ../docs/api-docs/src/config/endpoints.ts \
            || { echo "::error::swagger.yaml / endpoints.ts are out of sync with the route layer. Run 'npm run generate:swagger && npm run generate:endpoints' in Servers/ and commit the result."; exit 1; }

      - name: Get changed files
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        id: changed-files
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "files=$(git diff --name-only --diff-filter=ACMRT origin/${{ github.base_ref }}...HEAD | grep '^Servers/' | sed 's|^Servers/||' | grep -E '\.(ts|tsx|js|jsx|json|md)$' | tr '\n' ' ')" >> "$GITHUB_OUTPUT"
          else
            echo "files=$(git diff --name-only --diff-filter=ACMRT HEAD~1 HEAD | grep '^Servers/' | sed 's|^Servers/||' | grep -E '\.(ts|tsx|js|jsx|json|md)$' | tr '\n' ' ')" >> "$GITHUB_OUTPUT"
          fi

      - name: Prettier format check
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.changed-files.outputs.files != '' }}
        run: npx prettier --check ${{ steps.changed-files.outputs.files }}

      - name: TypeScript type check
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run build

      # ESLint gate (#4617-3). Blocking: `npm run lint` currently reports 0 errors
      # (3.5k `no-explicit-any` warnings remain; they do not affect the exit code
      # and are being burned down separately). eslint exits non-zero on any error,
      # so a green step here means no lint errors were introduced.
      - name: ESLint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run lint

      # The unit suite runs once, with coverage, in the Coverage Gate job below.

      # Blocking. The limiters are the only thing standing between /users/login and
      # unlimited password guesses, and the unit suite cannot see them: it excludes
      # tests/integration/, and a limiter is invisible to a unit test with its store
      # mocked out. These three suites need no database and no environment, so they
      # run here rather than in the Postgres job. The wiring suite is excluded
      # because it builds the real app, which needs ENCRYPTION_KEY at module load —
      # it runs in tenant-isolation-tests instead.
      - name: Rate-limiter verification suite
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run test:ratelimit

      - name: i18n audit (catch dictionary drift)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run i18n:audit:strict

      # de/fr are checked against en.json above; this checks en.json against the
      # code: every server message needs a key, and no message may skip req.t.
      - name: i18n en.json check (catch server messages without a key)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          npm run test:i18n-scripts
          npm run i18n:check-en

      - name: API documentation drift check
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run check:api-drift

      - name: Dependency vulnerability audit
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          npm audit --audit-level=high --omit=dev || true
          node $GITHUB_WORKSPACE/scripts/security/npm-audit-gate.js .

      # Full report (dev dependencies included) for review; never blocks.
      - name: npm audit report (JSON)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm audit --json > ../audit-results.json || true

      - name: Upload audit results
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: backend-npm-audit-results
          path: audit-results.json
          retention-days: 30

      - name: Dependency Review
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          deny-licenses: GPL-3.0, AGPL-3.0
          allow-ghsas: GHSA-mh99-v99m-4gvg, GHSA-qwww-vcr4-c8h2
          # jszip is dual-licensed (MIT OR GPL-3.0-or-later); VerifyWise uses it
          # under MIT. The 3.10.1 -> 3.10.2 bump re-triggers the license heuristic.
          allow-dependencies-licenses: pkg:npm/jszip

  # One job per suite, in parallel: run in series they took ~9 minutes and set
  # the pace for every backend PR. Each job has its own Postgres, and each
  # suite's globalSetup migrates it, so no suite depends on another having run.
  #
  # Not on push: the PR already ran them; the nightly run covers develop.
  tenant-isolation-tests:
    name: Tenant Isolation Integration Tests (${{ matrix.suite }}${{ matrix.rls == 'on' && ', RLS enforced' || '' }})
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite: [isolation-matrix, regression-suites, risk-links, vendor-research, smoke-and-audit]
        # (#4680) The isolation pack must be proven with the RLS runtime flag
        # both off (current default) and on (RLS_ENFORCEMENT_ENABLED=true), so
        # the flag can be flipped in production without losing the guarantee.
        # Other suites are flag-independent — run them once, RLS off.
        rls: [off, on]
        exclude:
          - suite: regression-suites
            rls: on
          - suite: risk-links
            rls: on
          - suite: vendor-research
            rls: on
          - suite: smoke-and-audit
            rls: on
    defaults:
      run:
        working-directory: Servers

    env:
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: verifywise_test
      NODE_ENV: test
      SUPERADMIN_EMAIL: super@local.dev
      SUPERADMIN_PASSWORD: Super123!
      JWT_SECRET: test-jwt-secret-key-for-testing-only
      REFRESH_TOKEN_SECRET: test-refresh-secret-key-for-testing-only
      ENCRYPTION_KEY: default-key-change-this-in-production-32chars!!
      # Required by the RLS runtime-role migration (rls-app-role.js), run via
      # globalSetup; it fails closed without it. CI-only value.
      DB_APP_PASSWORD: test-app-role-password-for-ci

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      # Only the vendor research suites need a real Redis (vendorResearch.enqueue
      # queues through BullMQ); every other suite mocks it in tests/integration/setup.ts.
      # An empty image starts no service container.
      redis:
        image: ${{ matrix.suite == 'vendor-research' && 'redis:7' || '' }}
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: Servers/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tenant-isolation integration matrix
        if: matrix.suite == 'isolation-matrix'
        env:
          # (#4680) Flag read by Servers/middleware/rls.middleware.ts and the
          # RLS pack (tests/integration/tenant-isolation/rls.enforcement.test.ts).
          RLS_ENFORCEMENT_ENABLED: ${{ matrix.rls == 'on' && 'true' || '' }}
        run: npm run test:integration -- --testPathPatterns=tenant-isolation

      # These suites live outside tests/integration/tenant-isolation/, so the
      # pattern above never reaches them. They exist because the defects they
      # cover -- an audit-log INSERT naming columns that do not exist, a uuid
      # column bound as text, user FKs that block deletion, RLS policies that
      # were never installed, a run whose project scope the visibility rule
      # cannot see, and a workflow that broadcasts on an empty result -- all
      # shipped through a green unit suite that mocked the database away.
      # Running them only locally would recreate exactly that blindness.
      #
      # file-manager belongs to the same category: its controller is fully
      # unit-tested with the repository mocked out, so tenant scoping, the
      # multi-table transactional delete and the response envelope the frontend
      # destructures are only exercised here, against a real database.
      # (#4617-10) Cross-tenant suites that live at tests/integration/ root —
      # login, projects, tasks, vendors and governance-os.cross-tenant — are
      # matched by the alternation below (previously only approval-workflows
      # from this group was covered; the rest were only run locally). Keep the
      # regex anchored to `tests/integration/(` so tenant-isolation/ subdir
      # files are picked up by the isolation-matrix step, not double-run here.
      - name: Run database-backed regression suites
        if: matrix.suite == 'regression-suites'
        run: |
          npm run test:integration -- --testPathPatterns='tests/integration/(login|projects|tasks|vendors|workflow-audit-log|user-deletion-fks|reporting-rls-policies|report-run-visibility|framework-gap-workflow|report-scope-membership|report-scope-authorization|workflow-approval-gate|audit-ledger-retention|file-manager|approval-workflows|rate-limiting/limiter-wiring|governance-os\.cross-tenant|home-queue-sources|modelWriteRules|useCaseBundledFrameworks)\.test\.ts'

      # The risk link suites (tests/integration/riskLinks.*.test.ts) used to run
      # only locally, so when c1047bb7c narrowed recompute to derived related_to
      # rows, two of them (recomputeEngine, vendorRelated) broke without any
      # check going red. They get a job of their own: they take nearly twice as
      # long as the regression suites above, and folded into that job they
      # would make it the slowest one in this matrix. A prefix rather than a
      # list of names, so a new riskLinks suite runs without editing this file;
      # anchored to `tests/integration/` like the regex above, so
      # tenant-isolation/riskLinks.isolation stays in the isolation matrix.
      - name: Run risk link integration suites
        if: matrix.suite == 'risk-links'
        run: npm run test:integration -- --testPathPatterns='tests/integration/riskLinks\.'

      # The vendor research and vendor risk database suites (vendorResearch.*,
      # vrdb.*, vendor-research*, vendor-risk-findings.*, vendorRisks.*) ran in no
      # job either. Prefixes rather than names, like the risk link step, so a new
      # suite of these areas runs without editing this file; anchored to
      # `tests/integration/` so their tenant-isolation/ files stay in the isolation
      # matrix, and vendors.test.ts stays in the regression suites.
      - name: Run vendor research integration suites
        if: matrix.suite == 'vendor-research'
        env:
          REDIS_URL: redis://localhost:6379/0
        run: npm run test:integration -- --testPathPatterns='tests/integration/(vendorResearch|vrdb|vendor-research|vendor-risk-findings|vendorRisks)[.-]'

      - name: Run deadline-summary smoke test
        if: matrix.suite == 'smoke-and-audit'
        run: npm run test:smoke

      # Needs a migrated database, so it runs after the smoke test's globalSetup.
      - name: Run schema-drift tenant isolation audit
        if: matrix.suite == 'smoke-and-audit'
        run: npx ts-node scripts/auditTenantIsolationCoverage.ts

  # Not on push: the PR already ran it; the nightly run covers develop.
  coverage:
    name: Coverage Gate
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Servers

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: Servers/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        # Suites run in 3 parallel workers (the runner has 4 vCPUs and 16 GB).
        # test:coverage no longer passes --detectOpenHandles, which forced every
        # suite into one process and made this the slowest job on a PR. Workers
        # are recycled at 1 GB idle heap. NODE_OPTIONS reaches every worker, so
        # the heap cap is per process: 3 GB x (3 workers + parent) fits in 16 GB.
        env:
          NODE_OPTIONS: --max-old-space-size=3072
        run: npm run test:coverage

      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage-report
          path: Servers/coverage/
          retention-days: 14

      - name: Post coverage gate comment on PR
        if: github.event_name == 'pull_request' && failure()
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require("fs");
            const summaryPath = "Servers/coverage/coverage-summary.json";
            if (!fs.existsSync(summaryPath)) {
              console.log("coverage-summary.json not found, skipping comment");
              return;
            }
            const json = JSON.parse(fs.readFileSync(summaryPath, "utf8"));
            const total = json.total;
            const threshold = { statements: 30, branches: 25, functions: 25, lines: 40 };
            const rows = ["| Metric | Threshold | Actual | Status |", "|--------|----------:|------:|:------:|"];
            let passed = true;
            for (const key of ["statements", "branches", "functions", "lines"]) {
              const actual = total[key].pct;
              const ok = actual >= threshold[key];
              if (!ok) passed = false;
              rows.push(`| ${key.charAt(0).toUpperCase() + key.slice(1)} | ${threshold[key]}% | ${actual}% | ${ok ? "✅" : "❌"} |`);
            }

            if (passed) {
              console.log("All coverage thresholds pass");
              return;
            }

            const body = `## Coverage Gate Failed\n\n${rows.join("\n")}\n\n<!-- coverage-gate -->`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const marker = "<!-- coverage-gate -->";
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
