name: EvalServer & EvaluationModule Checks

permissions:
  contents: read

on:
  pull_request:
    branches: ['master', 'develop']
    paths:
      - 'EvalServer/**'
      - 'EvaluationModule/**'
      - '.github/workflows/evalserver-checks.yml'
  push:
    branches: ['master', 'develop']
    paths:
      - 'EvalServer/**'
      - 'EvaluationModule/**'
      - '.github/workflows/evalserver-checks.yml'

# A newer push to the same PR cancels the older run (the org's Free plan runs
# at most 20 jobs at once). Any other run is grouped by its own commit and
# event, so it neither cancels nor replaces a queued run of another commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python-tests:
    name: Python Tests (pytest)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            EvalServer/requirements.txt
            EvalServer/requirements-test.txt

      - name: Install EvalServer runtime + test dependencies
        working-directory: EvalServer
        run: |
          python -m pip install --upgrade pip
          # Test deps are minimal and fast — install them first
          pip install -r requirements-test.txt
          # Runtime deps are heavy (torch, transformers, ...) but the test files
          # import EvalServer source modules that require them.
          pip install -r requirements.txt

      - name: Audit EvalServer dependencies (pip-audit)
        working-directory: EvalServer
        run: |
          python -m pip install pip-audit
          python -m pip_audit -r requirements.txt

      - name: Run EvalServer tests (excluding integration smoke tests)
        working-directory: EvalServer
        env:
          DB_USER: test
          DB_PASSWORD: test
          DB_HOST: localhost
          DB_PORT: '5432'
          DB_NAME: verifywise_test
        run: |
          python -m pytest tests/ -v \
            --ignore=tests/test_integration_openrouter.py \
            -m "not integration"

  evaluation-module-tests:
    name: EvaluationModule Tests (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: EvaluationModule

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            EvaluationModule/requirements.txt

      - name: Cache EvaluationModule virtualenv
        uses: actions/cache@v6
        with:
          path: EvaluationModule/.venv
          key: evaluationmodule-venv-${{ runner.os }}-3.12-${{ hashFiles('EvaluationModule/requirements.txt', 'EvaluationModule/requirements-test.txt') }}
          restore-keys: |
            evaluationmodule-venv-${{ runner.os }}-3.12-

      - name: Create virtualenv
        run: |
          if [ ! -x .venv/bin/python ]; then
            rm -rf .venv
            python -m venv .venv
          fi

      - name: Install EvaluationModule runtime + test dependencies
        run: |
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install pytest
          .venv/bin/python -m pip install -r requirements.txt

      - name: Audit EvaluationModule dependencies (pip-audit)
        run: |
          .venv/bin/python -m pip install pip-audit
          # CVE-2026-81726 (GHSA-8mgp-746c-j5xp / PYSEC-2026-3740): nltk model-artifact APIs bypass
          # pathsec sandbox. Unfixed upstream — 3.10.3 (latest) is still marked last_affected. We pin
          # nltk>=3.10.3 in requirements.txt and suppress until a patched release exists.
          # TODO: remove --ignore-vuln once nltk ships a fix (see nltk/nltk#3813).
          .venv/bin/python -m pip_audit -r requirements.txt --ignore-vuln PYSEC-2026-3740

      - name: Install EvaluationModule test mocks
        run: .venv/bin/python -m pip install respx

      - name: Run EvaluationModule tests
        working-directory: EvaluationModule
        run: |
          .venv/bin/python -m pytest tests/ -v -m "not integration"
