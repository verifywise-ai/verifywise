name: AIGateway Checks

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches: ['master', 'develop']
    paths:
      - 'AIGateway/**'
      - '.github/workflows/aigateway-checks.yml'
  push:
    branches: ['master', 'develop']
    paths:
      - 'AIGateway/**'
      - '.github/workflows/aigateway-checks.yml'

jobs:
  aigateway-tests:
    name: AIGateway Tests (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: AIGateway

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: AIGateway/requirements.txt

      - name: Cache AIGateway virtualenv
        uses: actions/cache@v6
        with:
          path: AIGateway/.venv
          key: aigateway-venv-${{ runner.os }}-3.12-${{ hashFiles('AIGateway/requirements.txt') }}
          restore-keys: |
            aigateway-venv-${{ runner.os }}-3.12-

      - name: Create virtualenv
        run: |
          if [ ! -x .venv/bin/python ]; then
            rm -rf .venv
            python -m venv .venv
          fi

      - name: Install AIGateway dependencies
        run: |
          .venv/bin/python -m pip install --upgrade pip
          # presidio-anonymizer 2.2.364 caps cryptography<49.0.0, but VerifyWise requires >=50.0.0.
          # Install presidio-anonymizer without deps; its only required dependency is cryptography,
          # which is already declared in requirements.txt.
          grep -v '^presidio-anonymizer' requirements.txt > /tmp/requirements-install.txt
          .venv/bin/python -m pip install -r /tmp/requirements-install.txt
          .venv/bin/python -m pip install --no-deps "$(grep '^presidio-anonymizer' requirements.txt)"
          .venv/bin/python -m pip install pytest pytest-asyncio

      - name: Audit AIGateway dependencies (pip-audit)
        run: |
          .venv/bin/python -m pip install pip-audit
          # Audit the installed environment so presidio-anonymizer (installed with --no-deps)
          # is checked alongside the cryptography>=50.0.0 requirement. The spaCy model
          # (en_core_web_md, a pinned GitHub wheel) is not on PyPI, so pip-audit skips it.
          # filelock CVE-2026-112909 (GHSA-69hj-f68j-2879) and CVE-2026-112910
          # (GHSA-8mx5-7m5m-r77g): moderate, local-only (another local user, or Windows ACLs).
          # Fixed only in filelock 4.2.1, and litellm caps filelock<4.0, so requirements.txt
          # stays on 3.20.3 (below the 3.20.4-4.2.0 high-severity window).
          # TODO: remove both --ignore-vuln and the filelock pin once litellm allows filelock>=4.2.1.
          .venv/bin/python -m pip_audit \
            --ignore-vuln CVE-2026-112909 \
            --ignore-vuln CVE-2026-112910

      # Most tests under tests/ are E2E and need a live Express backend,
      # gateway, and database (see tests/conftest.py). Run only the
      # self-contained subset that passes without live services: the pure
      # unit suites (tests/unit, test_cache_service, test_cost_service) and
      # the mocked router/service suites listed below.
      - name: Run self-contained AIGateway tests
        env:
          DB_USER: test
          DB_PASSWORD: test
          DB_HOST: localhost
          DB_PORT: '5432'
          DB_NAME: verifywise_test
          AI_GATEWAY_INTERNAL_KEY: test-internal-key-not-real
          ENCRYPTION_KEY: default-key-change-this-in-production-32chars!!
          OPENAI_API_KEY: sk-test
        run: |
          .venv/bin/python -m pytest \
            tests/unit \
            tests/test_cache_service.py \
            tests/test_cost_service.py \
            tests/test_proxy_tool_calling.py \
            tests/test_virtual_key_endpoint_names.py \
            tests/test_endpoint_delete_keeps_key_limits.py \
            tests/test_guardrail_test_route.py \
            tests/test_guardrail_logs_route.py \
            tests/test_guardrail_scan_offload.py \
            tests/test_spend_by_day_sql.py \
            tests/test_model_catalog_contract.py \
            tests/test_internal_completion_errors.py \
            tests/test_redaction.py \
            tests/test_agent_policy_scope.py \
            tests/test_retention.py \
            tests/test_agent_control_retention.py \
            tests/test_internal_key.py \
            tests/test_18_mcp_credentials.py \
            tests/test_19_mcp_discovery.py \
            tests/test_20_mcp_servers_router.py \
            tests/test_21_safe_outbound_url.py \
            tests/test_22_monitor_mode.py \
            tests/test_24_mcp_oauth_discovery.py \
            tests/test_mcp_hook_tool_acls.py \
            tests/test_mcp_hook_result_outcome.py \
            tests/test_mcp_hook_request_validation.py \
            tests/test_config_change_notifications.py \
            tests/test_endpoint_role_visibility.py \
            tests/test_invalid_unicode_body.py \
            tests/test_api_key_saved_verify.py \
            tests/test_endpoint_model_prefix.py \
            tests/test_change_history_columns.py \
            -v
