name: IaC Security Scan

# Trivy misconfiguration scan of infrastructure-as-code (OWASP 2025 A02):
# Kubernetes manifests, Dockerfiles, docker-compose, Ansible, GitHub Actions.
# Results go to the GitHub Security tab; the job fails on CRITICAL
# misconfigurations.

permissions:
  contents: read
  security-events: write

on:
  pull_request:
    branches: [master, develop]
    paths:
      - 'kubernetes/**'
      - 'ansible/**'
      - '**/Dockerfile*'
      - 'docker-compose*.yml'
      - '.github/workflows/**'
  push:
    branches: [master, develop]
    paths:
      - 'kubernetes/**'
      - 'ansible/**'
      - '**/Dockerfile*'
      - 'docker-compose*.yml'
      - '.github/workflows/**'
  workflow_dispatch:

jobs:
  trivy-config:
    name: Trivy IaC misconfiguration scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # Table-format pass purely for log visibility: the SARIF pass below
      # uploads to the Security tab but hides findings from the job log,
      # which made a previous failure impossible to diagnose remotely.
      - name: Run Trivy config scan (table output to log)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'config'
          scan-ref: '.'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'
          ignore-unfixed: true
          # Skip vendored/third-party and local tooling directories — their
          # Dockerfiles (e.g. node_modules/bcrypt) are not our IaC to harden.
          skip-dirs: 'node_modules,**/node_modules,.claude'
          # The action does NOT auto-load the repo-root .trivyignore; it must be
          # pointed at explicitly, or the accepted findings (AVD-DS-0002,
          # AVD-KSV-0014, justified in that file) fail the gate.
          trivyignores: '.trivyignore'

      # NOTE: limit-severities-for-sarif is required — without it the action
      # builds the SARIF report with ALL severities (dropping the severity
      # filter), and exit-code 1 then fails the job on LOW/MEDIUM findings
      # too, which contradicts the CRITICAL,HIGH gate above.
      - name: Run Trivy config scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'config'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-config-results.sarif'
          severity: 'CRITICAL,HIGH'
          limit-severities-for-sarif: 'CRITICAL,HIGH'
          exit-code: '1'
          ignore-unfixed: true
          # Skip vendored/third-party and local tooling directories — their
          # Dockerfiles (e.g. node_modules/bcrypt) are not our IaC to harden.
          skip-dirs: 'node_modules,**/node_modules,.claude'
          # The action does NOT auto-load the repo-root .trivyignore; it must be
          # pointed at explicitly, or the accepted findings (AVD-DS-0002,
          # AVD-KSV-0014, justified in that file) fail the gate.
          trivyignores: '.trivyignore'

      - name: Upload Trivy config results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: 'trivy-config-results.sarif'
          category: 'iac-config'
