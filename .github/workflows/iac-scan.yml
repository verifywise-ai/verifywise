name: IaC Security Scan

# Trivy misconfiguration scan of infrastructure-as-code (OWASP 2025 A02):
# Kubernetes manifests, Dockerfiles, docker-compose, Ansible, GitHub Actions.
# Results go to the GitHub Security tab; the job fails on CRITICAL
# misconfigurations.

permissions:
  contents: read
  security-events: write

on:
  pull_request:
    branches: [master, develop]
    paths:
      - 'kubernetes/**'
      - 'observability/**'
      - 'ansible/**'
      - '**/Dockerfile*'
      - 'docker-compose*.yml'
      - '.github/workflows/**'
  push:
    branches: [master, develop]
    paths:
      - 'kubernetes/**'
      - 'observability/**'
      - 'ansible/**'
      - '**/Dockerfile*'
      - 'docker-compose*.yml'
      - '.github/workflows/**'
  workflow_dispatch:

jobs:
  trivy-config:
    name: Trivy IaC misconfiguration scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # This is the GATE. The table format honors .trivyignore for the exit code;
      # the SARIF format below does NOT (a known trivy-action quirk where
      # limit-severities-for-sarif + exit-code computes the code on the
      # unfiltered result, so ignored AVD-DS-0002 / AVD-KSV-0014 still fail it).
      # So we fail the job here (table) and make the SARIF step upload-only.
      - name: Run Trivy config scan (gate)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'config'
          scan-ref: '.'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          ignore-unfixed: true
          # Skip vendored/third-party and local tooling directories — their
          # Dockerfiles (e.g. node_modules/bcrypt) are not our IaC to harden.
          skip-dirs: 'node_modules,**/node_modules,.claude'
          # The action does NOT auto-load the repo-root .trivyignore; it must be
          # pointed at explicitly, or the accepted findings (AVD-DS-0002,
          # AVD-KSV-0014, justified in that file) fail the gate.
          trivyignores: '.trivyignore'

      # Upload-only: exit-code 0 so a SARIF-format quirk can't fail the job (the
      # table step above is the authoritative gate). always() so the report is
      # still uploaded even when the gate fails.
      - name: Run Trivy config scan (SARIF for Security tab)
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'config'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-config-results.sarif'
          severity: 'CRITICAL,HIGH'
          limit-severities-for-sarif: 'CRITICAL,HIGH'
          exit-code: '0'
          ignore-unfixed: true
          skip-dirs: 'node_modules,**/node_modules,.claude'
          trivyignores: '.trivyignore'

      - name: Upload Trivy config results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: 'trivy-config-results.sarif'
          category: 'iac-config'

  # (#4617-5) Helm chart lint + render. helm template catches values/templates
  # that parse but render to invalid or unexpected manifests — a class Trivy's
  # config scan cannot see (it scans static YAML, not Helm templating).
  helm-lint:
    name: Helm lint and template (verifywise chart)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Helm lint
        run: helm lint kubernetes/helm/verifywise

      - name: Helm template (render check)
        run: helm template verifywise kubernetes/helm/verifywise > /tmp/verifywise-rendered.yaml

      - name: Upload rendered manifests
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: helm-rendered-manifests
          path: /tmp/verifywise-rendered.yaml
          if-no-files-found: ignore
          retention-days: 7

  # (#4617-11, #4683-CI) Validate the observability stack configs with the
  # upstream projects' own validators (promtool/amtool) rather than generic
  # YAML parsing alone: promtool check config also validates scrape_configs
  # semantics, and promtool check rules validates alert-rule expressions.
  observability-validate:
    name: Validate observability configs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # The apt prometheus package is a 2.x build that cannot parse the v3
      # `otlp` field this stack's config uses (compose deploys
      # prom/prometheus:v3.1.0), and the alertmanager apt package is not in
      # the runner's default repos — so fetch pinned upstream binaries.
      - name: Install promtool and amtool
        env:
          PROMETHEUS_VERSION: 3.1.0
          AMTOOL_VERSION: 0.27.0
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-yaml
          curl -fsSL "https://github.com/prometheus/prometheus/releases/download/v${PROMETHEUS_VERSION}/prometheus-${PROMETHEUS_VERSION}.linux-amd64.tar.gz" | tar -xz
          sudo cp "prometheus-${PROMETHEUS_VERSION}.linux-amd64/promtool" /usr/local/bin/promtool
          curl -fsSL "https://github.com/prometheus/alertmanager/releases/download/v${AMTOOL_VERSION}/alertmanager-${AMTOOL_VERSION}.linux-amd64.tar.gz" | tar -xz
          sudo cp "alertmanager-${AMTOOL_VERSION}.linux-amd64/amtool" /usr/local/bin/amtool
          promtool --version
          amtool --version

      - name: promtool check config (prometheus.yml)
        run: promtool check config observability/prometheus.yml

      - name: promtool check rules (alerts.yml)
        run: promtool check rules observability/alerts.yml

      # Guarded: the observability pod added this file in this PR; keep the
      # job green on branches where it does not exist yet.
      - name: amtool check-config (alertmanager.yml)
        if: hashFiles('observability/alertmanager/alertmanager.yml') != ''
        run: amtool check-config observability/alertmanager/alertmanager.yml

      - name: Validate Grafana dashboard JSON
        run: |
          node -e "
            const fs = require('fs'), path = require('path');
            const dir = 'observability/grafana/dashboards';
            if (!fs.existsSync(dir)) { console.log('no dashboards dir; skipping'); process.exit(0); }
            const files = fs.readdirSync(dir).filter(f => f.endsWith('.json'));
            if (files.length === 0) { console.log('no dashboard JSON files; skipping'); process.exit(0); }
            for (const f of files) {
              const p = path.join(dir, f);
              const j = JSON.parse(fs.readFileSync(p, 'utf8'));
              if (!j.panels && !j.dashboard) throw new Error(p + ': not a Grafana dashboard shape');
              console.log('OK', p);
            }
          "

      - name: YAML-parse Loki and OTel collector configs
        run: |
          python3 -c "import yaml; yaml.safe_load(open('observability/loki-config.yaml')); print('OK observability/loki-config.yaml')"
          python3 -c "import yaml; yaml.safe_load(open('observability/otel-collector-config.yaml')); print('OK observability/otel-collector-config.yaml')"
