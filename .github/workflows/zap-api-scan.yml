name: ZAP API Scan

# OWASP ZAP authenticated API scan driven by Servers/swagger.yaml.
# Runs nightly against a full ephemeral stack. A JWT is obtained through
# the real login endpoint and injected into every scan request via a ZAP
# replacer rule. The job fails when High/Critical alerts are found.
#
# Tuning: add suppressions to .zap/rules.tsv as false positives are triaged.

permissions:
  contents: read

on:
  schedule:
    - cron: '0 5 * * *' # nightly
  workflow_dispatch:

jobs:
  zap-api-scan:
    name: ZAP authenticated API scan
    runs-on: ubuntu-latest
    timeout-minutes: 75

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: verifywise_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install backend dependencies
        working-directory: Servers
        run: npm ci --legacy-peer-deps

      - name: Build backend
        working-directory: Servers
        run: npm run build

      - name: Run migrations
        working-directory: Servers
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: verifywise_test
          DB_USER: postgres
          DB_PASSWORD: postgres
          # Required by the RLS runtime-role migration (rls-app-role.js), which
          # fails closed without it. CI-only value; not a real credential.
          DB_APP_PASSWORD: test-app-role-password-for-ci
          SUPERADMIN_EMAIL: admin@verifywise-test.com
          SUPERADMIN_PASSWORD: TestAdmin!Str0ng
        run: npx sequelize db:migrate

      - name: Seed test data
        working-directory: Servers
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: verifywise_test
          DB_USER: postgres
          DB_PASSWORD: postgres
        run: node dist/scripts/seedTestData.js

      - name: Start backend
        working-directory: Servers
        env:
          PORT: 3000
          NODE_ENV: test
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: verifywise_test
          DB_USER: postgres
          DB_PASSWORD: postgres
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          JWT_SECRET: test-jwt-secret-for-e2e
          REFRESH_TOKEN_SECRET: test-refresh-secret-for-e2e
          ENCRYPTION_KEY: test-encryption-key-32chars!!
          MULTI_TENANCY_ENABLED: false
          AI_GATEWAY_URL: http://localhost:8100
          AI_GATEWAY_INTERNAL_KEY: test-ai-gateway-key-for-e2e
          EVAL_SERVER_INTERNAL_KEY: test-eval-server-key-for-zap
        run: |
          node dist/index.js &
          for i in $(seq 1 30); do
            curl -s http://localhost:3000/api/users/check/exists && break
            sleep 1
          done

      - name: Obtain access token via login
        id: auth
        run: |
          RESPONSE=$(curl -s -X POST http://localhost:3000/api/users/login \
            -H "Content-Type: application/json" \
            -d '{"email":"admin@verifywise-test.com","password":"TestAdmin!Str0ng"}')
          TOKEN=$(echo "$RESPONSE" | jq -r '.data.token')
          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
            echo "Login failed: $RESPONSE"
            exit 1
          fi
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: ZAP authenticated API scan
        env:
          ZAP_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          mkdir -p zap-reports && chmod 777 zap-reports
          docker run --rm --network host \
            -v ${{ github.workspace }}:/zap/wrk:rw \
            -e ZAP_TOKEN \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-api-scan.py \
            -t /zap/wrk/Servers/swagger.yaml -f openapi \
            -O http://localhost:3000/api \
            -c /zap/wrk/.zap/rules.tsv \
            -T 50 \
            -r /zap/wrk/zap-reports/api-scan.html \
            -J /zap/wrk/zap-reports/api-scan.json \
            -z "-config replacer.full_list(0).description=auth \
                -config replacer.full_list(0).enabled=true \
                -config replacer.full_list(0).matchtype=REQ_HEADER \
                -config replacer.full_list(0).matchstr=Authorization \
                -config replacer.full_list(0).regex=false \
                -config replacer.full_list(0).replacement=Bearer\ ${ZAP_TOKEN}" || true

      - name: Fail on High/Critical alerts
        run: |
          HIGH=$(jq '[.site[].alerts[] | select((.riskcode | tonumber) >= 3)] | length' zap-reports/api-scan.json)
          echo "High/Critical alerts: $HIGH"
          if [ "$HIGH" -gt 0 ]; then
            jq -r '.site[].alerts[] | select((.riskcode | tonumber) >= 3) | "\(.risk) — \(.name) (\(.instances | length) instances)"' zap-reports/api-scan.json | sort -u
            exit 1
          fi

      - name: Upload ZAP API scan report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: zap-api-scan-report
          path: zap-reports/
          retention-days: 30
