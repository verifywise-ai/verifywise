name: SBOM Generation

# Generates CycloneDX SBOMs on every published release and uploads them as
# release assets (and workflow artifacts).

permissions:
  contents: write

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  sbom:
    name: Generate SBOMs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Generate repository SBOM (CycloneDX)
        uses: anchore/sbom-action@v0
        with:
          path: ./
          format: cyclonedx-json
          output-file: sbom-repository.json

      - name: Upload SBOM as workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: sbom-repository.json
          retention-days: 90

      - name: Attach SBOM to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: sbom-repository.json
