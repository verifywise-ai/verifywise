name: Frontend Checks

permissions:
  contents: read
  security-events: write
  pull-requests: write

on:
  pull_request:
    branches: ['master', 'develop']
    paths:
      - 'Clients/**'
      - 'ansible/templates/verifywise-nginx.conf.j2'
      - '.github/workflows/frontend-checks.yml'
  push:
    branches: ['master', 'develop']
    paths:
      - 'Clients/**'
      - 'ansible/templates/verifywise-nginx.conf.j2'
      - '.github/workflows/frontend-checks.yml'
  # Manual trigger only: used by the flake-check job (#4503-CI), which runs the
  # unit suite three consecutive times and is too heavy for PR CI.
  workflow_dispatch:

jobs:
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Clients

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: Clients/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run npm audit
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Run npm audit (JSON output for review)
        run: npm audit --json > ../audit-results.json || true

      - name: Upload audit results
        uses: actions/upload-artifact@v7
        with:
          name: frontend-npm-audit-results
          path: audit-results.json
          retention-days: 30

  lint-and-typecheck:
    name: Lint, Types & i18n
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Clients

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: Clients/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Prettier format check
        run: npm run format-check

      - name: TypeScript type check
        run: npm run typecheck

      - name: ESLint (errors only)
        # (#4617-3) Frontend ESLint gate. Already enforced here via --quiet
        # (errors fail the job); warnings are left non-blocking while the
        # backlog is burned down.
        run: npm run lint -- --quiet

      - name: i18n audit (catch dictionary drift)
        run: npm run i18n:audit:strict

      - name: Dependency vulnerability audit
        run: |
          npm audit --audit-level=high --omit=dev || true
          node $GITHUB_WORKSPACE/scripts/security/npm-audit-gate.js .

  # The production nginx image must proxy /api and /v1 to the backend. Builds
  # only the Dockerfile's nginx stage (no npm build), so it takes seconds.
  nginx-proxy:
    name: Frontend nginx proxies /api and /v1
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Test the nginx proxy routes
        run: Clients/scripts/test-nginx-proxy.sh

  unit-and-component-tests:
    name: Unit & Component Tests (shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    defaults:
      run:
        working-directory: Clients

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: Clients/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      # Each shard also collects raw coverage into its blob report.
      # VITEST_SHARD_RUN turns off per-shard thresholds and report files
      # (see vite.config.ts); the Coverage job merges and enforces them.
      - name: Run tests (shard ${{ matrix.shard }}/4)
        env:
          VITEST_SHARD_RUN: "1"
        run: npx vitest run --shard=${{ matrix.shard }}/4 --reporter=blob --coverage

      - name: Upload blob report
        uses: actions/upload-artifact@v7
        with:
          name: vitest-blob-${{ matrix.shard }}
          path: Clients/.vitest/blob/
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error

  # Merges the shards' blob reports instead of re-running the whole suite:
  # writes the coverage report and enforces the configured thresholds.
  coverage:
    name: Coverage
    needs: unit-and-component-tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Clients

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: Clients/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Download blob reports
        uses: actions/download-artifact@v8
        with:
          pattern: vitest-blob-*
          path: Clients/.vitest/blob/
          merge-multiple: true

      - name: Merge shard reports and check coverage
        run: npx vitest --merge-reports --coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage-report
          path: Clients/coverage/
          retention-days: 14

      - name: Post coverage gate failure comment
        if: github.event_name == 'pull_request' && failure()
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require("fs");
            const summaryPath = "Clients/coverage/coverage-summary.json";
            if (!fs.existsSync(summaryPath)) {
              console.log("coverage-summary.json not found, skipping comment");
              return;
            }
            const json = JSON.parse(fs.readFileSync(summaryPath, "utf8"));
            const total = json.total;
            const threshold = { statements: 50, branches: 40, functions: 45, lines: 50 };
            const rows = ["| Metric | Threshold | Actual | Status |", "|--------|----------:|------:|:------:|"];
            let passed = true;
            for (const key of ["statements", "branches", "functions", "lines"]) {
              const actual = total[key].pct;
              const ok = actual >= threshold[key];
              if (!ok) passed = false;
              rows.push(`| ${key.charAt(0).toUpperCase() + key.slice(1)} | ${threshold[key]}% | ${actual}% | ${ok ? "✅" : "❌"} |`);
            }

            if (passed) {
              console.log("All coverage thresholds pass");
              return;
            }

            const body = `## Coverage Gate Failed\n\n${rows.join("\n")}\n\n<!-- coverage-gate -->`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const marker = "<!-- coverage-gate -->";
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Post coverage gate success comment
        if: github.event_name == 'pull_request' && success()
        uses: actions/github-script@v9
        with:
          script: |
            const body = "## ✅ Coverage Gate Passed\n\nAll coverage thresholds are met.\n\n<!-- coverage-gate -->";
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const marker = "<!-- coverage-gate -->";
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  # (#4503-CI) Flake detector: run the unit suite 3 consecutive times with
  # retries disabled. Running the full suite three times per PR roughly
  # triples the CI wall-clock and compute cost of every frontend PR for a
  # signal that matters maybe once a month, so this is workflow_dispatch-only
  # — run it when touching the test harness, timers, or async fixtures, and
  # investigate any pass1/pass2/pass3 mismatch. If a suite proves stable over
  # time, consider promoting a smoke subset to a blocking PR job instead.
  flake-check:
    name: Flake check (3 consecutive unit runs)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Clients

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: Clients/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run unit suite 3 consecutive times (retries disabled)
        run: |
          for i in 1 2 3; do
            echo "=== Flake check run $i/3 ==="
            npx vitest run --retry=0
          done

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7

      - name: Dependency Review
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          deny-licenses: GPL-3.0, AGPL-3.0
          allow-ghsas: GHSA-mh99-v99m-4gvg, GHSA-qwww-vcr4-c8h2
          # jszip is dual-licensed (MIT OR GPL-3.0-or-later); VerifyWise uses it
          # under MIT. The 3.10.1 -> 3.10.2 bump re-triggers the license heuristic.
          allow-dependencies-licenses: pkg:npm/jszip
