name: Frontend Checks

permissions:
  contents: read
  security-events: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches: ['master', 'develop']
    paths:
      - 'Clients/**'
      - '.github/workflows/frontend-checks.yml'
  push:
    branches: ['master', 'develop']
    paths:
      - 'Clients/**'
      - '.github/workflows/frontend-checks.yml'

jobs:
  lint-and-typecheck:
    name: Lint, Types & i18n
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: Clients

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: Clients/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Prettier format check
        run: npm run format-check

      - name: TypeScript type check
        run: npm run typecheck

      - name: i18n audit (catch dictionary drift)
        run: npm run i18n:audit:strict

      - name: Dependency vulnerability audit
        run: |
          npm audit --audit-level=high --omit=dev || true
          node $GITHUB_WORKSPACE/scripts/security/npm-audit-gate.js .

  unit-and-component-tests:
    name: Unit & Component Tests (shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    defaults:
      run:
        working-directory: Clients

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: Clients/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run tests (shard ${{ matrix.shard }}/4)
        run: npx vitest run --shard=${{ matrix.shard }}/4

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'push'
    defaults:
      run:
        working-directory: Clients

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: Clients/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run tests with coverage
        run: npm run test:ci

      - name: Dependency vulnerability audit
        run: |
          npm audit --audit-level=high --omit=dev || true
          node $GITHUB_WORKSPACE/scripts/security/npm-audit-gate.js .

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage-report
          path: Clients/coverage/
          retention-days: 14

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7

      - name: Dependency Review
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          deny-licenses: GPL-3.0, AGPL-3.0
