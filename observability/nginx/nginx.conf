# Auth-gated ingress for the OTel Collector.
#
# Deployments push OTLP to :4318 with `Authorization: Bearer <jwt>`. The njs
# module `auth.js` verifies the RS256 signature with the observability PUBLIC
# key (the private signing key never lives here); on success we internalRedirect
# to @collector.

load_module modules/ngx_http_js_module.so;

# Optional override for the public-key path (defaults to
# /etc/nginx/keys/observability-public.pem inside auth.js). Without this
# directive nginx strips env vars from worker processes.
env OBSERVABILITY_PUBLIC_KEY_PATH;

events {}

http {
    js_path "/etc/nginx/njs";
    js_import auth from auth.js;

    # Upstream to the internal collector (not exposed to the host).
    upstream otel_collector_http {
        server otel-collector:4318;
    }

    server {
        listen 4318;
        server_name _;

        # Body size cap for OTLP payloads. Collector default handles this fine;
        # this is just a belt-and-braces limit against absurdly large pushes.
        client_max_body_size 16m;

        # All ingest paths (OTLP: /v1/metrics, /v1/logs, /v1/traces) go through
        # the JS auth handler (async — RS256 verify via WebCrypto). Anything
        # else 404s.
        location ~ ^/v1/(metrics|logs|traces)$ {
            js_content auth.verify;
        }

        # Handoff target used by auth.js on successful verification. Marked
        # internal so external clients can't reach it directly.
        location @collector {
            internal;
            proxy_pass http://otel_collector_http;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Cheap liveness probe for the ingress itself.
        location = /health {
            access_log off;
            return 200 "ok\n";
        }

        location / {
            return 404;
        }
    }
}
