version: '3.9'

services:
  postgresdb:
    expose:
      - "$DB_PORT"
    shm_size: 1g
    command: postgres -c max_locks_per_transaction=8192
    volumes:
      - db-prod:/var/lib/postgresql/data  # Separate volume for prod database

  backend:
    env_file:
      - ./.env.prod
    # Shadow AI syslog listener (off by default). Set SHADOW_AI_SYSLOG_* in
    # .env.prod (see docs/technical/infrastructure/shadow-ai-syslog.md), mount
    # the TLS certificate and key, and publish the port:
    # ports:
    #   - "6514:6514"

  worker:
    env_file:
      - ./.env.prod

  frontend:
    ports:
      # Bind to localhost only: direct public access would bypass the
      # TLS-terminating host nginx (plain HTTP). Nginx proxies via localhost.
      - "127.0.0.1:${FRONTEND_PORT}:80"
    env_file:
      - ./.env.prod
  
  eval_server:
    env_file:
      - ./.env.prod
    volumes:
      - eval_uploads-prod:/app/data/uploads

  ai_gateway:
    env_file:
      - ./.env.prod

volumes:
  db-prod:
  eval_uploads-prod:
